<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Virtual Pet</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        :root {
            --bg: #0a0f1e;
            --card: #161b2e;
            --border: #252b45;
            --accent: #22c55e;
        }
        
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background: var(--bg);
            color: #e2e8f0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }
        .app {
            max-width: 380px;
            margin: 0 auto;
            padding: 10px 12px;
            padding-top: max(10px, env(safe-area-inset-top));
            padding-bottom: max(10px, env(safe-area-inset-bottom));
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 0 2px;
        }
        .title {
            font-family: 'Press Start 2P', system-ui;
            font-size: 20px;
            font-weight: 700;
            color: #22c55e;
            letter-spacing: 0.5px;
            margin: 0;
        }
        .reset-btn {
            background: #3f1f1f;
            color: #fda4af;
            border: none;
            padding: 5px 11px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .pet-container {
            background: #161b2e;
            border: 2px solid #252b45;
            border-radius: 20px;
            padding: 14px;
            margin-bottom: 10px;
            box-shadow: 0 6px 20px -4px rgb(0 0 0 / 0.3);
            text-align: center;
        }
        #petCanvas {
            image-rendering: pixelated;
            border-radius: 12px;
            background: #252b45;
        }
        .mood { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; margin-bottom: 1px; }
        .age { font-size: 9px; color: #64748b; }
        .tab-bar {
            display: flex;
            background: #161b2e;
            border: 1.5px solid #252b45;
            border-radius: 999px;
            padding: 3px;
            margin-bottom: 12px;
            box-shadow: 0 3px 10px -2px rgb(0 0 0 / 0.2);
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            font-size: 11px;
            font-weight: 700;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab.active {
            background: #22c55e;
            color: #0a0f1e;
            box-shadow: 0 2px 6px rgb(34 197 94 / 0.4);
        }
        .view { display: none; }
        .view.active { display: block; }
        .section-header {
            font-size: 9px;
            font-weight: 700;
            color: #64748b;
            letter-spacing: 1px;
            margin: 0 0 6px 4px;
        }
        .stats-compact {
            background: #161b2e;
            border: 1.5px solid #252b45;
            border-radius: 14px;
            padding: 10px 12px;
        }
        .stat-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 7px;
        }
        .stat-row:last-child { margin-bottom: 0; }
        .stat-icon { font-size: 17px; width: 22px; }
        .stat-info { flex: 1; }
        .stat-name { font-size: 13px; font-weight: 600; }
        .stat-val { font-family: ui-monospace, monospace; font-size: 12px; font-weight: 700; color: #cbd5e1; }
        .progress { height: 5px; background: #252b45; border-radius: 999px; overflow: hidden; margin-top: 3px; }
        .progress-bar { height: 100%; transition: width 0.3s ease; }
        .hunger .progress-bar { background: linear-gradient(#f59e0b, #fb923c); }
        .happiness .progress-bar { background: linear-gradient(#ec4899, #f43f5e); }
        .cleanliness .progress-bar { background: linear-gradient(#06b6d4, #22d3ee); }
        .energy .progress-bar { background: linear-gradient(#eab308, #facc15); }
        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
        }
        .action-btn {
            background: #161b2e;
            border: 1.5px solid #252b45;
            border-radius: 14px;
            padding: 14px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .action-btn:active { transform: scale(0.96); background: #1f253d; }
        .action-icon { font-size: 24px; }
        .action-label { font-weight: 700; font-size: 13px; }
        .action-sub { font-size: 9px; color: #64748b; }
        .status-bar {
            background: #161b2e;
            border: 1.5px solid #252b45;
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            gap: 9px;
            align-items: flex-start;
        }
        .status-text { font-size: 12.5px; line-height: 1.4; flex: 1; }
        .critical { color: #f87171; font-weight: 600; }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <div class="header">
            <h1 class="title">VIRTUAL PET</h1>
            <button onclick="resetPet()" class="reset-btn">
                <span>↻</span>
                <span style="font-size:9px">RESET</span>
            </button>
        </div>

        <!-- Pet with Animation -->
        <div class="pet-container">
            <canvas id="petCanvas" width="140" height="140"></canvas>
            <div id="petMood" class="mood" style="color:#22c55e; margin-top: 8px;">VERY HAPPY</div>
            <div class="age">Age: <span id="ageValue">0</span> days • <span id="petNameDisplay">Pixel</span></div>
        </div>

        <!-- Tab Bar -->
        <div class="tab-bar">
            <div onclick="switchView('status')" id="tab-status" class="tab active">STATUS</div>
            <div onclick="switchView('care')" id="tab-care" class="tab">CARE</div>
        </div>

        <!-- STATUS VIEW -->
        <div id="view-status" class="view active">
            <div class="section-header">NEEDS</div>
            <div class="stats-compact">
                <div class="stat-row hunger">
                    <div class="stat-icon">🍎</div>
                    <div class="stat-info">
                        <div style="display:flex;justify-content:space-between;align-items:center">
                            <div class="stat-name">Hunger</div>
                            <div id="hungerValue" class="stat-val">80</div>
                        </div>
                        <div class="progress"><div id="hungerBar" class="progress-bar" style="width:80%"></div></div>
                    </div>
                </div>
                <div class="stat-row happiness">
                    <div class="stat-icon">❤️</div>
                    <div class="stat-info">
                        <div style="display:flex;justify-content:space-between;align-items:center">
                            <div class="stat-name">Happiness</div>
                            <div id="happinessValue" class="stat-val">75</div>
                        </div>
                        <div class="progress"><div id="happinessBar" class="progress-bar" style="width:75%"></div></div>
                    </div>
                </div>
                <div class="stat-row cleanliness">
                    <div class="stat-icon">🧼</div>
                    <div class="stat-info">
                        <div style="display:flex;justify-content:space-between;align-items:center">
                            <div class="stat-name">Cleanliness</div>
                            <div id="cleanValue" class="stat-val">85</div>
                        </div>
                        <div class="progress"><div id="cleanBar" class="progress-bar" style="width:85%"></div></div>
                    </div>
                </div>
                <div class="stat-row energy">
                    <div class="stat-icon">⚡</div>
                    <div class="stat-info">
                        <div style="display:flex;justify-content:space-between;align-items:center">
                            <div class="stat-name">Energy</div>
                            <div id="energyValue" class="stat-val">90</div>
                        </div>
                        <div class="progress"><div id="energyBar" class="progress-bar" style="width:90%"></div></div>
                    </div>
                </div>
            </div>

            <div style="margin-top:10px">
                <div class="section-header">STATUS</div>
                <div class="status-bar">
                    <div style="font-size:16px">💬</div>
                    <div id="statusMessage" class="status-text">Your pet is happy and well cared for.</div>
                </div>
            </div>
        </div>

        <!-- CARE VIEW -->
        <div id="view-care" class="view">
            <div class="section-header">ACTIONS</div>
            <div class="actions-grid">
                <button onclick="feedPet()" class="action-btn">
                    <div class="action-icon">🍎</div>
                    <div class="action-label">Feed</div>
                    <div class="action-sub">+ Hunger</div>
                </button>
                <button onclick="playWithPet()" class="action-btn">
                    <div class="action-icon">🎮</div>
                    <div class="action-label">Play</div>
                    <div class="action-sub">+ Happiness</div>
                </button>
                <button onclick="cleanPet()" class="action-btn">
                    <div class="action-icon">🧼</div>
                    <div class="action-label">Clean</div>
                    <div class="action-sub">+ Cleanliness</div>
                </button>
                <button onclick="restPet()" class="action-btn">
                    <div class="action-icon">🛏️</div>
                    <div class="action-label">Rest</div>
                    <div class="action-sub">+ Energy</div>
                </button>
            </div>
            <div style="margin-top:10px; font-size:10px; color:#64748b; text-align:center; padding:0 10px;">
                Tap an action to care for your pet.
            </div>
        </div>
    </div>

    <script>
        let pet = { name: "Pixel", hunger: 80, happiness: 75, cleanliness: 85, energy: 90, age: 0 };
        let messages = [];
        let decayInterval = null;
        let currentView = 'status';
        let animFrame = 0;

        const canvas = document.getElementById('petCanvas');
        const ctx = canvas.getContext('2d', { alpha: true });

        function drawPet(mood, breathOffset = 0, flameFlicker = 0) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.imageSmoothingEnabled = false;

            const cx = 70;
            const cy = 72 + breathOffset;

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.25)';
            ctx.beginPath();
            ctx.ellipse(cx, cy + 58, 38, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            // Body
            ctx.fillStyle = '#e85d04';
            ctx.fillRect(cx - 26, cy + 8, 52, 46);

            // Belly
            ctx.fillStyle = '#faa307';
            ctx.fillRect(cx - 18, cy + 20, 36, 28);

            // Head
            ctx.fillStyle = '#e85d04';
            ctx.fillRect(cx - 28, cy - 28, 56, 40);

            // Snout
            ctx.fillStyle = '#faa307';
            ctx.fillRect(cx - 16, cy + 4, 32, 16);

            // Eyes
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(cx - 18, cy - 18, 11, 11);
            ctx.fillRect(cx + 7, cy - 18, 11, 11);

            ctx.fillStyle = '#111111';
            ctx.fillRect(cx - 14, cy - 14, 5, 5);
            ctx.fillRect(cx + 11, cy - 14, 5, 5);

            // Eyebrows
            ctx.strokeStyle = '#111111';
            ctx.lineWidth = 2;
            if (mood === 'happy') {
                ctx.beginPath();
                ctx.arc(cx - 12, cy - 22, 5, Math.PI, 0);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx + 12, cy - 22, 5, Math.PI, 0);
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.moveTo(cx - 18, cy - 20);
                ctx.lineTo(cx - 6, cy - 16);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx + 6, cy - 16);
                ctx.lineTo(cx + 18, cy - 20);
                ctx.stroke();
            }

            // Horns
            ctx.fillStyle = '#9d0208';
            ctx.fillRect(cx - 26, cy - 36, 8, 12);
            ctx.fillRect(cx + 18, cy - 36, 8, 12);

            // Head flame (flickers)
            const flameHeight = 14 + flameFlicker;
            ctx.fillStyle = '#ffba08';
            ctx.fillRect(cx - 6, cy - 42, 12, flameHeight);
            ctx.fillStyle = '#e85d04';
            ctx.fillRect(cx - 3, cy - 38, 6, flameHeight - 4);

            // Tail
            ctx.fillStyle = '#e85d04';
            ctx.fillRect(cx - 42, cy + 28, 20, 12);

            // Tail flame (flickers)
            const tailFlameH = 14 + flameFlicker * 0.8;
            ctx.fillStyle = '#ffba08';
            ctx.fillRect(cx - 48, cy + 26, 14, tailFlameH);
            ctx.fillStyle = '#e85d04';
            ctx.fillRect(cx - 45, cy + 29, 8, tailFlameH - 4);

            // Wings
            ctx.fillStyle = '#9d0208';
            ctx.fillRect(cx - 38, cy + 10, 12, 16);
            ctx.fillRect(cx + 26, cy + 10, 12, 16);

            // Feet
            ctx.fillStyle = '#9d0208';
            ctx.fillRect(cx - 20, cy + 52, 10, 8);
            ctx.fillRect(cx + 10, cy + 52, 10, 8);
        }

        let lastTime = 0;
        function animate(timestamp = 0) {
            const delta = timestamp - lastTime;
            lastTime = timestamp;

            animFrame += 0.08;

            // Breathing (slow sine wave)
            const breath = Math.sin(animFrame * 0.8) * 1.5;

            // Flame flicker (random-ish)
            const flameFlicker = Math.sin(animFrame * 3) * 2 + (Math.random() - 0.5) * 1.5;

            const avg = (pet.hunger + pet.happiness + pet.cleanliness + pet.energy) / 4;
            let mood = (avg >= 50) ? 'happy' : 'sad';

            drawPet(mood, breath, flameFlicker);

            requestAnimationFrame(animate);
        }

        function updatePetVisual() {
            // This is now handled by the animation loop
            const avg = (pet.hunger + pet.happiness + pet.cleanliness + pet.energy) / 4;
            let moodText = 'VERY HAPPY';
            let moodColor = '#22c55e';

            if (avg >= 80) {
                moodText = 'VERY HAPPY';
                moodColor = '#22c55e';
            } else if (avg >= 60) {
                moodText = 'HAPPY';
                moodColor = '#22c55e';
            } else if (avg >= 40) {
                moodText = 'NEEDS CARE';
                moodColor = '#f59e0b';
            } else {
                moodText = 'STRUGGLING';
                moodColor = '#ef4444';
            }

            const moodEl = document.getElementById('petMood');
            moodEl.textContent = moodText;
            moodEl.style.color = moodColor;
        }

        function savePet() {
            localStorage.setItem('virtualPet', JSON.stringify(pet));
            localStorage.setItem('virtualPetMessages', JSON.stringify(messages));
        }

        function loadPet() {
            const saved = localStorage.getItem('virtualPet');
            if (saved) pet = { ...pet, ...JSON.parse(saved) };
            const savedMsg = localStorage.getItem('virtualPetMessages');
            if (savedMsg) messages = JSON.parse(savedMsg);
        }

        function updateUI() {
            document.getElementById('hungerValue').textContent = Math.round(pet.hunger);
            document.getElementById('happinessValue').textContent = Math.round(pet.happiness);
            document.getElementById('cleanValue').textContent = Math.round(pet.cleanliness);
            document.getElementById('energyValue').textContent = Math.round(pet.energy);
            document.getElementById('ageValue').textContent = Math.floor(pet.age);
            document.getElementById('petNameDisplay').textContent = pet.name;

            document.getElementById('hungerBar').style.width = pet.hunger + '%';
            document.getElementById('happinessBar').style.width = pet.happiness + '%';
            document.getElementById('cleanBar').style.width = pet.cleanliness + '%';
            document.getElementById('energyBar').style.width = pet.energy + '%';

            updatePetVisual();
            updateStatusMessage();
        }

        function updateStatusMessage() {
            const avg = (pet.hunger + pet.happiness + pet.cleanliness + pet.energy) / 4;
            const el = document.getElementById('statusMessage');
            el.classList.remove('critical');

            if (avg >= 85) el.textContent = `${pet.name} is thriving! You're doing great.`;
            else if (avg >= 70) el.textContent = `${pet.name} is happy and well cared for.`;
            else if (avg >= 50) el.textContent = `${pet.name} could use some attention.`;
            else if (avg >= 30) { el.textContent = `${pet.name} is feeling neglected.`; el.classList.add('critical'); }
            else { el.textContent = `${pet.name} is really struggling...`; el.classList.add('critical'); }
        }

        function addMessage(text) {
            messages.unshift(text);
            if (messages.length > 4) messages.pop();
            const el = document.getElementById('statusMessage');
            el.textContent = text;
            el.classList.remove('critical');
            savePet();
        }

        function feedPet() {
            if (pet.hunger >= 95) { addMessage(`${pet.name} is already full!`); return; }
            pet.hunger = Math.min(100, pet.hunger + 22);
            pet.happiness = Math.min(100, pet.happiness + 5);
            pet.energy = Math.max(0, pet.energy - 3);
            addMessage(`You fed ${pet.name}.`);
            updateUI(); savePet(); checkLow();
        }

        function playWithPet() {
            if (pet.energy < 15) { addMessage(`${pet.name} is too tired.`); return; }
            pet.happiness = Math.min(100, pet.happiness + 25);
            pet.hunger = Math.max(0, pet.hunger - 8);
            pet.energy = Math.max(0, pet.energy - 18);
            pet.cleanliness = Math.max(0, pet.cleanliness - 5);
            addMessage(`You played with ${pet.name}!`);
            updateUI(); savePet(); checkLow();
        }

        function cleanPet() {
            if (pet.cleanliness >= 95) { addMessage(`${pet.name} is already clean.`); return; }
            pet.cleanliness = Math.min(100, pet.cleanliness + 28);
            pet.happiness = Math.min(100, pet.happiness + 8);
            pet.energy = Math.max(0, pet.energy - 5);
            addMessage(`You cleaned ${pet.name}.`);
            updateUI(); savePet(); checkLow();
        }

        function restPet() {
            if (pet.energy >= 95) { addMessage(`${pet.name} isn't tired.`); return; }
            pet.energy = Math.min(100, pet.energy + 30);
            pet.hunger = Math.max(0, pet.hunger - 5);
            pet.happiness = Math.min(100, pet.happiness + 4);
            addMessage(`${pet.name} rested.`);
            updateUI(); savePet(); checkLow();
        }

        function checkLow() {
            const low = [];
            if (pet.hunger <= 15) low.push('hungry');
            if (pet.happiness <= 15) low.push('unhappy');
            if (pet.cleanliness <= 15) low.push('dirty');
            if (pet.energy <= 15) low.push('exhausted');
            if (low.length) {
                const el = document.getElementById('statusMessage');
                el.textContent = `${pet.name} is ${low.join(' and ')}!`;
                el.classList.add('critical');
            }
        }

        function decayStats() {
            const r = 1.05;
            pet.hunger = Math.max(0, pet.hunger - r * 0.85);
            pet.happiness = Math.max(0, pet.happiness - r * 0.75);
            pet.cleanliness = Math.max(0, pet.cleanliness - r * 0.55);
            pet.energy = Math.max(0, pet.energy - r * 0.65);
            if (Math.random() < 0.05) pet.happiness = Math.max(0, pet.happiness - 3);
            if (Math.random() < 0.08) pet.age += 0.08;
            updateUI(); savePet(); checkLow();
        }

        function startDecay() {
            if (decayInterval) clearInterval(decayInterval);
            decayInterval = setInterval(decayStats, 6500);
        }

        function switchView(view) {
            document.getElementById('view-status').classList.remove('active');
            document.getElementById('view-care').classList.remove('active');
            document.getElementById('tab-status').classList.remove('active');
            document.getElementById('tab-care').classList.remove('active');

            document.getElementById('view-' + view).classList.add('active');
            document.getElementById('tab-' + view).classList.add('active');
            currentView = view;
        }

        function resetPet() {
            if (!confirm('Reset your pet?')) return;
            pet = { name: "Pixel", hunger: 80, happiness: 75, cleanliness: 85, energy: 90, age: 0 };
            messages = [];
            localStorage.removeItem('virtualPet');
            localStorage.removeItem('virtualPetMessages');
            updateUI();
            document.getElementById('statusMessage').textContent = 'Fresh start!';
            document.getElementById('statusMessage').classList.remove('critical');
        }

        function init() {
            loadPet();
            document.getElementById('petNameDisplay').textContent = pet.name;
            updateUI();
            const msgEl = document.getElementById('statusMessage');
            if (messages.length === 0) msgEl.textContent = `Welcome! Take good care of ${pet.name}.`;
            else msgEl.textContent = messages[0] || 'Welcome back!';
            startDecay();

            // Start animation loop
            requestAnimationFrame(animate);
        }

        window.onload = init;
    </script>
</body>
</html>
