<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Virtual Pet</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        :root {
            --bg: #0a0f1e;
        }
        
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background: var(--bg);
            color: #e2e8f0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }
        .app {
            max-width: 420px;
            margin: 0 auto;
            padding: 14px 12px;
            padding-top: max(14px, env(safe-area-inset-top));
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 0 6px;
        }
        .title {
            font-family: 'Press Start 2P', system-ui;
            font-size: 18px;
            font-weight: 700;
            color: #22c55e;
            letter-spacing: 0.5px;
            margin: 0;
        }
        .version {
            font-size: 9px;
            color: #64748b;
            margin-left: 6px;
        }
        .reset-btn {
            background: #3f1f1f;
            color: #fda4af;
            border: none;
            padding: 5px 11px;
            border-radius: 999px;
            font-size: 9px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .device-frame {
            background: #161b2e;
            border: 6px solid #475569;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 12px 35px -10px rgb(0 0 0 / 0.5);
        }

        .egg-container {
            text-align: center;
            padding: 20px 0;
        }
        .egg-instruction {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 16px;
        }
        #eggCanvas {
            image-rendering: pixelated;
            cursor: pointer;
            border-radius: 12px;
            background: #0f172a;
        }

        .stats-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 8px;
            font-size: 13px;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stat-item span:last-child {
            font-weight: 700;
            font-size: 14px;
        }

        .pet-screen {
            background: #0f172a;
            border: 5px solid #475569;
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 14px;
            display: flex;
            justify-content: center;
        }
        #petCanvas {
            image-rendering: pixelated;
            background: #1e2937;
            border-radius: 10px;
        }

        .pet-status {
            text-align: center;
            margin-bottom: 12px;
        }
        .mood { font-size: 13px; font-weight: 700; letter-spacing: 1px; }
        .age { font-size: 11px; color: #64748b; }

        .action-row {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }
        .action-btn {
            flex: 1;
            background: #1e2937;
            border: 2px solid #475569;
            border-radius: 12px;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .action-btn:active { background: #334155; }
        .action-icon { font-size: 24px; }
        .action-label { font-size: 12px; font-weight: 700; }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <div class="header">
            <div style="display:flex; align-items:flex-end;">
                <h1 class="title">VIRTUAL PET</h1>
                <span class="version">v3.2</span>
            </div>
            <button onclick="resetPet()" class="reset-btn">
                <span>↻</span>
                <span style="font-size:9px">RESET</span>
            </button>
        </div>

        <!-- Egg Screen -->
        <div id="egg-screen" class="device-frame egg-container">
            <div class="egg-instruction">Tap the egg to hatch your baby</div>
            <canvas id="eggCanvas" width="200" height="200"></canvas>
        </div>

        <!-- Main Pet Screen -->
        <div id="pet-screen" style="display: none;">
            <div class="device-frame">

                <!-- Top stats -->
                <div class="stats-top">
                    <div class="stat-item">
                        <span>🍎</span>
                        <span id="hungerValue">80</span>
                    </div>
                    <div class="stat-item">
                        <span>❤️</span>
                        <span id="happinessValue">75</span>
                    </div>
                    <div class="stat-item">
                        <span>🧼</span>
                        <span id="cleanValue">85</span>
                    </div>
                    <div class="stat-item">
                        <span>⚡</span>
                        <span id="energyValue">90</span>
                    </div>
                </div>

                <!-- Pet -->
                <div class="pet-screen">
                    <canvas id="petCanvas" width="220" height="220"></canvas>
                </div>

                <!-- Status -->
                <div class="pet-status">
                    <div id="petMood" class="mood" style="color:#22c55e;">VERY HAPPY</div>
                    <div class="age">Age: <span id="ageValue">0</span> days • <span id="petNameDisplay">Pixel</span></div>
                </div>

                <!-- Actions -->
                <div class="action-row">
                    <button onclick="feedPet()" class="action-btn">
                        <div class="action-icon">🍎</div>
                        <div class="action-label">Feed</div>
                    </button>
                    <button onclick="playWithPet()" class="action-btn">
                        <div class="action-icon">🎮</div>
                        <div class="action-label">Play</div>
                    </button>
                    <button onclick="cleanPet()" class="action-btn">
                        <div class="action-icon">🧼</div>
                        <div class="action-label">Clean</div>
                    </button>
                    <button onclick="restPet()" class="action-btn">
                        <div class="action-icon">🛏️</div>
                        <div class="action-label">Rest</div>
                    </button>
                </div>

                <!-- Stage buttons -->
                <div style="margin-top: 10px; display: flex; gap: 6px; justify-content: center;">
                    <button onclick="setStage(0)" style="font-size:10px; padding:4px 8px;">Baby</button>
                    <button onclick="setStage(1)" style="font-size:10px; padding:4px 8px;">Child</button>
                    <button onclick="setStage(2)" style="font-size:10px; padding:4px 8px;">Adult</button>
                    <button onclick="setStage(3)" style="font-size:10px; padding:4px 8px;">Ultimate</button>
                </div>

            </div>
        </div>
    </div>

    <script>
        let pet = { name: "Pixel", hunger: 80, happiness: 75, cleanliness: 85, energy: 90, age: 0 };
        let messages = [];
        let decayInterval = null;
        let animFrame = 0;
        let currentStage = 0;
        let hasHatched = false;
        let eggAnimating = false;

        const eggCanvas = document.getElementById('eggCanvas');
        const eggCtx = eggCanvas.getContext('2d', { alpha: true });

        const petCanvas = document.getElementById('petCanvas');
        const petCtx = petCanvas.getContext('2d', { alpha: true });

        function drawEgg(crackLevel = 0) {
            eggCtx.clearRect(0, 0, eggCanvas.width, eggCanvas.height);
            eggCtx.imageSmoothingEnabled = false;

            const cx = 100;
            const cy = 100;

            eggCtx.fillStyle = 'rgba(0,0,0,0.3)';
            eggCtx.beginPath();
            eggCtx.ellipse(cx, cy + 55, 55, 18, 0, 0, Math.PI * 2);
            eggCtx.fill();

            eggCtx.fillStyle = '#fefce8';
            eggCtx.beginPath();
            eggCtx.ellipse(cx, cy, 48, 62, 0, 0, Math.PI * 2);
            eggCtx.fill();

            eggCtx.fillStyle = '#e7e5d9';
            eggCtx.beginPath();
            eggCtx.ellipse(cx + 12, cy, 36, 58, 0, 0, Math.PI * 2);
            eggCtx.fill();

            eggCtx.fillStyle = '#fefce8';
            eggCtx.beginPath();
            eggCtx.ellipse(cx - 18, cy - 20, 18, 24, 0, 0, Math.PI * 2);
            eggCtx.fill();

            eggCtx.strokeStyle = '#854d0e';
            eggCtx.lineWidth = 2;

            if (crackLevel >= 1) {
                eggCtx.beginPath();
                eggCtx.moveTo(cx - 10, cy - 30);
                eggCtx.lineTo(cx + 5, cy - 10);
                eggCtx.stroke();
            }
            if (crackLevel >= 2) {
                eggCtx.beginPath();
                eggCtx.moveTo(cx + 5, cy - 10);
                eggCtx.lineTo(cx - 8, cy + 15);
                eggCtx.stroke();
            }
            if (crackLevel >= 3) {
                eggCtx.beginPath();
                eggCtx.moveTo(cx - 8, cy + 15);
                eggCtx.lineTo(cx + 12, cy + 35);
                eggCtx.stroke();
            }
            if (crackLevel >= 4) {
                eggCtx.beginPath();
                eggCtx.moveTo(cx + 5, cy - 10);
                eggCtx.lineTo(cx + 25, cy - 5);
                eggCtx.stroke();
            }
        }

        function hatchAnimation() {
            if (eggAnimating) return;
            eggAnimating = true;

            let crack = 0;
            const interval = setInterval(() => {
                crack++;
                drawEgg(crack);

                if (crack >= 5) {
                    clearInterval(interval);

                    setTimeout(() => {
                        hasHatched = true;
                        currentStage = 0;

                        document.getElementById('egg-screen').style.display = 'none';
                        document.getElementById('pet-screen').style.display = 'block';

                        drawPet('happy', 0, 0);
                        updateUI();
                        startDecay();
                        requestAnimationFrame(animate);

                        eggAnimating = false;
                    }, 400);
                }
            }, 180);
        }

        // WHISK LINE - Floating cat on nimbus (Air/Cat theme)

        // STAGE 0: PUFF (Baby) - Cute head on tiny cloud puff
        function drawPuff(mood, breathOffset, flameFlicker) {
            const cx = 110;
            const cy = 128 + breathOffset;

            // Tiny cloud puff shadow
            petCtx.fillStyle = 'rgba(0,0,0,0.2)';
            petCtx.beginPath();
            petCtx.ellipse(cx, cy + 58, 42, 12, 0, 0, Math.PI * 2);
            petCtx.fill();

            // Tiny cloud puff
            petCtx.fillStyle = '#e0f2fe';
            petCtx.beginPath();
            petCtx.ellipse(cx, cy + 52, 38, 14, 0, 0, Math.PI * 2);
            petCtx.fill();

            // Very tiny body
            petCtx.fillStyle = '#64748b';
            petCtx.beginPath();
            petCtx.ellipse(cx, cy + 32, 22, 18, 0, 0, Math.PI * 2);
            petCtx.fill();

            // Big cute kitten head
            petCtx.fillStyle = '#64748b';
            petCtx.beginPath();
            petCtx.ellipse(cx, cy - 14, 46, 40, 0, 0, Math.PI * 2);
            petCtx.fill();

            // Snout
            petCtx.fillStyle = '#94a3b8';
            petCtx.beginPath();
            petCtx.ellipse(cx, cy + 6, 14, 11, 0, 0, Math.PI * 2);
            petCtx.fill();

            // Big eyes
            petCtx.fillStyle = '#ffffff';
            petCtx.fillRect(cx - 18, cy - 22, 11, 11);
            petCtx.fillRect(cx + 7, cy - 22, 11, 11);

            petCtx.fillStyle = '#0f172a';
            petCtx.fillRect(cx - 14, cy - 18, 5, 5);
            petCtx.fillRect(cx + 11, cy - 18, 5, 5);

            petCtx.fillStyle = '#ffffff';
            petCtx.fillRect(cx - 12, cy - 20, 2, 2);
            petCtx.fillRect(cx + 13, cy - 20, 2, 2);

            // Happy whiskers
            petCtx.strokeStyle = '#0f172a';
            petCtx.lineWidth = 1;
            petCtx.beginPath();
            petCtx.moveTo(cx - 22, cy + 2);
            petCtx.lineTo(cx - 32, cy);
            petCtx.stroke();
            petCtx.beginPath();
            petCtx.moveTo(cx - 22, cy + 6);
            petCtx.lineTo(cx - 32, cy + 6);
            petCtx.stroke();

            petCtx.beginPath();
            petCtx.moveTo(cx + 22, cy + 2);
            petCtx.lineTo(cx + 32, cy);
            petCtx.stroke();
            petCtx.beginPath();
            petCtx.moveTo(cx + 22, cy + 6);
            petCtx.lineTo(cx + 32, cy + 6);
            petCtx.stroke();

            // Tiny ears
            petCtx.fillStyle = '#475569';
            petCtx.beginPath();
            petCtx.moveTo(cx - 20, cy - 38);
            petCtx.lineTo(cx - 28, cy - 48);
            petCtx.lineTo(cx - 12, cy - 42);
            petCtx.fill();

            petCtx.beginPath();
            petCtx.moveTo(cx + 20, cy - 38);
            petCtx.lineTo(cx + 28, cy - 48);
            petCtx.lineTo(cx + 12, cy - 42);
            petCtx.fill();

            // Small cloud details
            petCtx.fillStyle = '#bae6fd';
            petCtx.beginPath();
            petCtx.ellipse(cx - 12, cy + 48, 8, 5, 0, 0, Math.PI * 2);
            petCtx.fill();
            petCtx.beginPath();
            petCtx.ellipse(cx + 14, cy + 50, 7, 4, 0, 0, Math.PI * 2);
            petCtx.fill();
        }

        // STAGE 1: WHISP (Child) - Young floating cat
        function drawWhisp(mood, breathOffset, flameFlicker) {
            const cx = 110;
            const cy = 118 + breathOffset;

            // Cloud platform
            petCtx.fillStyle = 'rgba(0,0,0,0.2)';
            petCtx.beginPath();
            petCtx.ellipse(cx, cy + 68, 48, 13, 0, 0, Math.PI * 2);
            petCtx.fill();

            petCtx.fillStyle = '#e0f2fe';
            petCtx.beginPath();
            petCtx.ellipse(cx, cy + 62, 44, 15, 0, 0, Math.PI * 2);
            petCtx.fill();

            // Developing body
            petCtx.fillStyle = '#64748b';
            petCtx.beginPath();
            petCtx.ellipse(cx, cy + 22, 32, 28, 0, 0, Math.PI * 2);
            petCtx.fill();

            // Head
            petCtx.fillStyle = '#64748b';
            petCtx.beginPath();
            petCtx.ellipse(cx, cy - 12, 42, 36, 0, 0, Math.PI * 2);
            petCtx.fill();

            petCtx.fillStyle = '#94a3b8';
            petCtx.beginPath();
            petCtx.ellipse(cx, cy + 6, 16, 12, 0, 0, Math.PI * 2);
            petCtx.fill();

            petCtx.fillStyle = '#ffffff';
            petCtx.fillRect(cx - 16, cy - 20, 10, 10);
            petCtx.fillRect(cx + 6, cy - 20, 10, 10);

            petCtx.fillStyle = '#0f172a';
            petCtx.fillRect(cx - 12, cy - 16, 4, 4);
            petCtx.fillRect(cx + 10, cy - 16, 4, 4);

            // Whiskers
            petCtx.strokeStyle = '#0f172a';
            petCtx.lineWidth = 1;
            petCtx.beginPath();
            petCtx.moveTo(cx - 20, cy + 2);
            petCtx.lineTo(cx - 30, cy);
            petCtx.stroke();
            petCtx.beginPath();
            petCtx.moveTo(cx + 20, cy + 2);
            petCtx.lineTo(cx + 30, cy);
            petCtx.stroke();

            // Ears
            petCtx.fillStyle = '#475569';
            petCtx.beginPath();
            petCtx.moveTo(cx - 18, cy - 34);
            petCtx.lineTo(cx - 26, cy - 44);
            petCtx.lineTo(cx - 10, cy - 38);
            petCtx.fill();

            petCtx.beginPath();
            petCtx.moveTo(cx + 18, cy - 34);
            petCtx.lineTo(cx + 26, cy - 44);
            petCtx.lineTo(cx + 10, cy - 38);
            petCtx.fill();

            // Small cloud details
            petCtx.fillStyle = '#bae6fd';
            petCtx.beginPath();
            petCtx.ellipse(cx - 14, cy + 58, 10, 6, 0, 0, Math.PI * 2);
            petCtx.fill();
            petCtx.beginPath();
            petCtx.ellipse(cx + 16, cy + 60, 9, 5, 0, 0, Math.PI * 2);
            petCtx.fill();
        }

        // STAGE 2: WHISK (Adult) - Graceful floating cat
        function drawWhisk(mood, breathOffset, flameFlicker) {
            const cx = 110;
            const cy = 110 + breathOffset;

            // Nimbus cloud
            petCtx.fillStyle = 'rgba(0,0,0,0.25)';
            petCtx.beginPath();
            petCtx.ellipse(cx, cy + 72, 55, 14, 0, 0, Math.PI * 2);
            petCtx.fill();

            petCtx.fillStyle = '#e0f2fe';
            petCtx.beginPath();
            petCtx.ellipse(cx, cy + 66, 50, 16, 0, 0, Math.PI * 2);
            petCtx.fill();

            // Body
            petCtx.fillStyle = '#64748b';
            petCtx.beginPath();
            petCtx.ellipse(cx, cy + 14, 38, 34, 0, 0, Math.PI * 2);
            petCtx.fill();

            // Head
            petCtx.fillStyle = '#64748b';
            petCtx.beginPath();
            petCtx.ellipse(cx, cy - 14, 40, 36, 0, 0, Math.PI * 2);
            petCtx.fill();

            petCtx.fillStyle = '#94a3b8';
            petCtx.beginPath();
            petCtx.ellipse(cx, cy + 6, 18, 13, 0, 0, Math.PI * 2);
            petCtx.fill();

            petCtx.fillStyle = '#ffffff';
            petCtx.fillRect(cx - 15, cy - 20, 10, 10);
            petCtx.fillRect(cx + 5, cy - 20, 10, 10);

            petCtx.fillStyle = '#0f172a';
            petCtx.fillRect(cx - 11, cy - 16, 4, 4);
            petCtx.fillRect(cx + 9, cy - 16, 4, 4);

            // Whiskers
            petCtx.strokeStyle = '#0f172a';
            petCtx.lineWidth = 1;
            petCtx.beginPath();
            petCtx.moveTo(cx - 20, cy + 2);
            petCtx.lineTo(cx - 32, cy - 2);
            petCtx.stroke();
            petCtx.beginPath();
            petCtx.moveTo(cx - 20, cy + 6);
            petCtx.lineTo(cx - 32, cy + 6);
            petCtx.stroke();

            petCtx.beginPath();
            petCtx.moveTo(cx + 20, cy + 2);
            petCtx.lineTo(cx + 32, cy - 2);
            petCtx.stroke();
            petCtx.beginPath();
            petCtx.moveTo(cx + 20, cy + 6);
            petCtx.lineTo(cx + 32, cy + 6);
            petCtx.stroke();

            // Ears
            petCtx.fillStyle = '#475569';
            petCtx.beginPath();
            petCtx.moveTo(cx - 16, cy - 36);
            petCtx.lineTo(cx - 26, cy - 48);
            petCtx.lineTo(cx - 8, cy - 40);
            petCtx.fill();

            petCtx.beginPath();
            petCtx.moveTo(cx + 16, cy - 36);
            petCtx.lineTo(cx + 26, cy - 48);
            petCtx.lineTo(cx + 8, cy - 40);
            petCtx.fill();

            // Cloud details
            petCtx.fillStyle = '#bae6fd';
            petCtx.beginPath();
            petCtx.ellipse(cx - 16, cy + 62, 12, 7, 0, 0, Math.PI * 2);
            petCtx.fill();
            petCtx.beginPath();
            petCtx.ellipse(cx + 18, cy + 64, 11, 6, 0, 0, Math.PI * 2);
            petCtx.fill();
        }

        // STAGE 3: NIMBRIX (Ultimate) - Majestic sky guardian
        function drawNimbrix(mood, breathOffset, flameFlicker) {
            const cx = 110;
            const cy = 102 + breathOffset;

            // Large majestic cloud
            petCtx.fillStyle = 'rgba(0,0,0,0.3)';
            petCtx.beginPath();
            petCtx.ellipse(cx, cy + 78, 62, 15, 0, 0, Math.PI * 2);
            petCtx.fill();

            petCtx.fillStyle = '#e0f2fe';
            petCtx.beginPath();
            petCtx.ellipse(cx, cy + 72, 56, 17, 0, 0, Math.PI * 2);
            petCtx.fill();

            // Strong body
            petCtx.fillStyle = '#475569';
            petCtx.beginPath();
            petCtx.ellipse(cx, cy + 10, 42, 38, 0, 0, Math.PI * 2);
            petCtx.fill();

            // Head
            petCtx.fillStyle = '#475569';
            petCtx.beginPath();
            petCtx.ellipse(cx, cy - 18, 44, 38, 0, 0, Math.PI * 2);
            petCtx.fill();

            petCtx.fillStyle = '#94a3b8';
            petCtx.beginPath();
            petCtx.ellipse(cx, cy + 4, 20, 14, 0, 0, Math.PI * 2);
            petCtx.fill();

            petCtx.fillStyle = '#ffffff';
            petCtx.fillRect(cx - 16, cy - 22, 11, 11);
            petCtx.fillRect(cx + 5, cy - 22, 11, 11);

            petCtx.fillStyle = '#0f172a';
            petCtx.fillRect(cx - 12, cy - 18, 5, 5);
            petCtx.fillRect(cx + 9, cy - 18, 5, 5);

            // Flowing whiskers
            petCtx.strokeStyle = '#0f172a';
            petCtx.lineWidth = 1.5;
            petCtx.beginPath();
            petCtx.moveTo(cx - 22, cy + 2);
            petCtx.lineTo(cx - 36, cy - 4);
            petCtx.stroke();
            petCtx.beginPath();
            petCtx.moveTo(cx - 22, cy + 6);
            petCtx.lineTo(cx - 36, cy + 6);
            petCtx.stroke();

            petCtx.beginPath();
            petCtx.moveTo(cx + 22, cy + 2);
            petCtx.lineTo(cx + 36, cy - 4);
            petCtx.stroke();
            petCtx.beginPath();
            petCtx.moveTo(cx + 22, cy + 6);
            petCtx.lineTo(cx + 36, cy + 6);
            petCtx.stroke();

            // Majestic ears
            petCtx.fillStyle = '#334155';
            petCtx.beginPath();
            petCtx.moveTo(cx - 18, cy - 38);
            petCtx.lineTo(cx - 30, cy - 52);
            petCtx.lineTo(cx - 8, cy - 42);
            petCtx.fill();

            petCtx.beginPath();
            petCtx.moveTo(cx + 18, cy - 38);
            petCtx.lineTo(cx + 30, cy - 52);
            petCtx.lineTo(cx + 8, cy - 42);
            petCtx.fill();

            // Cloud details
            petCtx.fillStyle = '#bae6fd';
            petCtx.beginPath();
            petCtx.ellipse(cx - 18, cy + 68, 14, 8, 0, 0, Math.PI * 2);
            petCtx.fill();
            petCtx.beginPath();
            petCtx.ellipse(cx + 20, cy + 70, 13, 7, 0, 0, Math.PI * 2);
            petCtx.fill();
        }

        function drawPet(mood, breathOffset, flameFlicker) {
            petCtx.clearRect(0, 0, petCanvas.width, petCanvas.height);

            if (currentStage === 0) drawPuff(mood, breathOffset, flameFlicker);
            else if (currentStage === 1) drawWhisp(mood, breathOffset, flameFlicker);
            else if (currentStage === 2) drawWhisk(mood, breathOffset, flameFlicker);
            else if (currentStage === 3) drawNimbrix(mood, breathOffset, flameFlicker);
        }

        function setStage(stage) {
            currentStage = stage;
            const avg = (pet.hunger + pet.happiness + pet.cleanliness + pet.energy) / 4;
            let mood = (avg >= 50) ? 'happy' : 'sad';
            drawPet(mood, 0, 0);
        }

        function animate() {
            animFrame += 0.12;
            const breath = Math.sin(animFrame * 1.0) * 2.0;
            const flameFlicker = Math.sin(animFrame * 3.8) * 2.8 + (Math.random() - 0.5) * 1.0;

            const avg = (pet.hunger + pet.happiness + pet.cleanliness + pet.energy) / 4;
            let mood = (avg >= 50) ? 'happy' : 'sad';

            drawPet(mood, breath, flameFlicker);
            requestAnimationFrame(animate);
        }

        function updatePetVisual() {
            const avg = (pet.hunger + pet.happiness + pet.cleanliness + pet.energy) / 4;
            let moodText = 'VERY HAPPY';
            let moodColor = '#22c55e';

            if (avg >= 80) {
                moodText = 'VERY HAPPY';
                moodColor = '#22c55e';
            } else if (avg >= 60) {
                moodText = 'HAPPY';
                moodColor = '#22c55e';
            } else if (avg >= 40) {
                moodText = 'NEEDS CARE';
                moodColor = '#f59e0b';
            } else {
                moodText = 'STRUGGLING';
                moodColor = '#ef4444';
            }

            const moodEl = document.getElementById('petMood');
            moodEl.textContent = moodText;
            moodEl.style.color = moodColor;
        }

        function savePet() {
            localStorage.setItem('virtualPet', JSON.stringify(pet));
            localStorage.setItem('hasHatched', hasHatched);
        }

        function loadPet() {
            const saved = localStorage.getItem('virtualPet');
            if (saved) pet = { ...pet, ...JSON.parse(saved) };

            const hatched = localStorage.getItem('hasHatched');
            if (hatched === 'true') hasHatched = true;
        }

        function updateUI() {
            document.getElementById('hungerValue').textContent = Math.round(pet.hunger);
            document.getElementById('happinessValue').textContent = Math.round(pet.happiness);
            document.getElementById('cleanValue').textContent = Math.round(pet.cleanliness);
            document.getElementById('energyValue').textContent = Math.round(pet.energy);
            document.getElementById('ageValue').textContent = Math.floor(pet.age);
            document.getElementById('petNameDisplay').textContent = pet.name;

            updatePetVisual();
        }

        function feedPet() {
            if (pet.hunger >= 95) return;
            pet.hunger = Math.min(100, pet.hunger + 22);
            pet.happiness = Math.min(100, pet.happiness + 5);
            pet.energy = Math.max(0, pet.energy - 3);
            updateUI();
            savePet();
        }

        function playWithPet() {
            if (pet.energy < 15) return;
            pet.happiness = Math.min(100, pet.happiness + 25);
            pet.hunger = Math.max(0, pet.hunger - 8);
            pet.energy = Math.max(0, pet.energy - 18);
            pet.cleanliness = Math.max(0, pet.cleanliness - 5);
            updateUI();
            savePet();
        }

        function cleanPet() {
            if (pet.cleanliness >= 95) return;
            pet.cleanliness = Math.min(100, pet.cleanliness + 28);
            pet.happiness = Math.min(100, pet.happiness + 8);
            pet.energy = Math.max(0, pet.energy - 5);
            updateUI();
            savePet();
        }

        function restPet() {
            if (pet.energy >= 95) return;
            pet.energy = Math.min(100, pet.energy + 32);
            pet.hunger = Math.max(0, pet.hunger - 5);
            pet.happiness = Math.min(100, pet.happiness + 4);
            updateUI();
            savePet();
        }

        function decayStats() {
            const r = 1.05;
            pet.hunger = Math.max(0, pet.hunger - r * 0.85);
            pet.happiness = Math.max(0, pet.happiness - r * 0.75);
            pet.cleanliness = Math.max(0, pet.cleanliness - r * 0.55);
            pet.energy = Math.max(0, pet.energy - r * 0.65);
            if (Math.random() < 0.05) pet.happiness = Math.max(0, pet.happiness - 3);
            if (Math.random() < 0.08) pet.age += 0.08;
            updateUI();
            savePet();
        }

        function startDecay() {
            if (decayInterval) clearInterval(decayInterval);
            decayInterval = setInterval(decayStats, 6500);
        }

        function resetPet() {
            if (!confirm('Reset and hatch a new egg?')) return;
            localStorage.removeItem('virtualPet');
            localStorage.removeItem('hasHatched');
            location.reload();
        }

        function init() {
            loadPet();

            if (!hasHatched) {
                document.getElementById('egg-screen').style.display = 'block';
                document.getElementById('pet-screen').style.display = 'none';

                drawEgg(0);

                eggCanvas.onclick = () => {
                    if (!eggAnimating) hatchAnimation();
                };
            } else {
                document.getElementById('egg-screen').style.display = 'none';
                document.getElementById('pet-screen').style.display = 'block';

                document.getElementById('petNameDisplay').textContent = pet.name;
                updateUI();
                startDecay();
                drawPet('happy', 0, 0);
                requestAnimationFrame(animate);
            }
        }

        window.onload = init;
    </script>
</body>
</html>
