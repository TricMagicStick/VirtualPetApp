<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Virtual Pet</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        :root {
            --bg: #0a0f1e;
        }
        
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background: var(--bg);
            color: #e2e8f0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }
        .app {
            max-width: 420px;
            margin: 0 auto;
            padding: 12px 10px;
            padding-top: max(12px, env(safe-area-inset-top));
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 0 8px;
        }
        .title {
            font-family: 'Press Start 2P', system-ui;
            font-size: 18px;
            font-weight: 700;
            color: #22c55e;
            letter-spacing: 0.5px;
            margin: 0;
        }
        .version {
            font-size: 9px;
            color: #64748b;
            margin-left: 6px;
        }
        .reset-btn {
            background: #3f1f1f;
            color: #fda4af;
            border: none;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 9px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .device-frame {
            background: #161b2e;
            border: 6px solid #475569;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 12px 35px -10px rgb(0 0 0 / 0.5);
        }

        .stats-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 8px;
            font-size: 13px;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stat-item span:last-child {
            font-weight: 700;
            font-size: 14px;
        }

        .pet-screen {
            background: #0f172a;
            border: 5px solid #475569;
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 14px;
            display: flex;
            justify-content: center;
        }
        #petCanvas {
            image-rendering: pixelated;
            background: #1e2937;
            border-radius: 10px;
        }

        .pet-status {
            text-align: center;
            margin-bottom: 12px;
        }
        .mood { font-size: 13px; font-weight: 700; letter-spacing: 1px; }
        .age { font-size: 11px; color: #64748b; }

        .action-row {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }
        .action-btn {
            flex: 1;
            background: #1e2937;
            border: 2px solid #475569;
            border-radius: 12px;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .action-btn:active { background: #334155; }
        .action-icon { font-size: 24px; }
        .action-label { font-size: 12px; font-weight: 700; }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <div class="header">
            <div style="display:flex; align-items:flex-end;">
                <h1 class="title">VIRTUAL PET</h1>
                <span class="version">v1.7</span>
            </div>
            <button onclick="resetPet()" class="reset-btn">
                <span>↻</span>
                <span style="font-size:9px">RESET</span>
            </button>
        </div>

        <!-- Framed device -->
        <div class="device-frame">

            <!-- Top stats -->
            <div class="stats-top">
                <div class="stat-item">
                    <span>🍎</span>
                    <span id="hungerValue">80</span>
                </div>
                <div class="stat-item">
                    <span>❤️</span>
                    <span id="happinessValue">75</span>
                </div>
                <div class="stat-item">
                    <span>🧼</span>
                    <span id="cleanValue">85</span>
                </div>
                <div class="stat-item">
                    <span>⚡</span>
                    <span id="energyValue">90</span>
                </div>
            </div>

            <!-- Pet screen -->
            <div class="pet-screen">
                <canvas id="petCanvas" width="220" height="220"></canvas>
            </div>

            <!-- Status -->
            <div class="pet-status">
                <div id="petMood" class="mood" style="color:#22c55e;">VERY HAPPY</div>
                <div class="age">Age: <span id="ageValue">0</span> days • <span id="petNameDisplay">Pixel</span></div>
            </div>

            <!-- Action buttons -->
            <div class="action-row">
                <button onclick="feedPet()" class="action-btn">
                    <div class="action-icon">🍎</div>
                    <div class="action-label">Feed</div>
                </button>
                <button onclick="playWithPet()" class="action-btn">
                    <div class="action-icon">🎮</div>
                    <div class="action-label">Play</div>
                </button>
                <button onclick="cleanPet()" class="action-btn">
                    <div class="action-icon">🧼</div>
                    <div class="action-label">Clean</div>
                </button>
                <button onclick="restPet()" class="action-btn">
                    <div class="action-icon">🛏️</div>
                    <div class="action-label">Rest</div>
                </button>
            </div>

        </div>
    </div>

    <script>
        let pet = { name: "Pixel", hunger: 80, happiness: 75, cleanliness: 85, energy: 90, age: 0 };
        let messages = [];
        let decayInterval = null;
        let animFrame = 0;

        const canvas = document.getElementById('petCanvas');
        const ctx = canvas.getContext('2d', { alpha: true });

        function drawPet(mood, breathOffset = 0, flameFlicker = 0) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.imageSmoothingEnabled = false;

            const cx = 110;
            const cy = 115 + breathOffset;

            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(cx, cy + 85, 58, 18, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#e85d04';
            ctx.fillRect(cx - 42, cy + 14, 84, 72);

            ctx.fillStyle = '#faa307';
            ctx.fillRect(cx - 28, cy + 34, 56, 44);

            ctx.fillStyle = '#e85d04';
            ctx.fillRect(cx - 44, cy - 44, 88, 64);

            ctx.fillStyle = '#faa307';
            ctx.fillRect(cx - 26, cy + 10, 52, 24);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(cx - 28, cy - 28, 16, 16);
            ctx.fillRect(cx + 12, cy - 28, 16, 16);

            ctx.fillStyle = '#111111';
            ctx.fillRect(cx - 23, cy - 23, 7, 7);
            ctx.fillRect(cx + 17, cy - 23, 7, 7);

            ctx.strokeStyle = '#111111';
            ctx.lineWidth = 3;
            if (mood === 'happy') {
                ctx.beginPath();
                ctx.arc(cx - 20, cy - 35, 7, Math.PI, 0);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx + 20, cy - 35, 7, Math.PI, 0);
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.moveTo(cx - 28, cy - 33);
                ctx.lineTo(cx - 12, cy - 26);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx + 12, cy - 26);
                ctx.lineTo(cx + 28, cy - 33);
                ctx.stroke();
            }

            ctx.fillStyle = '#9d0208';
            ctx.fillRect(cx - 42, cy - 58, 12, 20);
            ctx.fillRect(cx + 30, cy - 58, 12, 20);

            const flameHeight = 20 + flameFlicker;
            ctx.fillStyle = '#ffba08';
            ctx.fillRect(cx - 10, cy - 68, 20, flameHeight);
            ctx.fillStyle = '#e85d04';
            ctx.fillRect(cx - 6, cy - 62, 12, flameHeight - 6);

            ctx.fillStyle = '#e85d04';
            ctx.fillRect(cx - 66, cy + 48, 28, 18);

            const tailFlameH = 20 + flameFlicker * 0.9;
            ctx.fillStyle = '#ffba08';
            ctx.fillRect(cx - 75, cy + 46, 22, tailFlameH);
            ctx.fillStyle = '#e85d04';
            ctx.fillRect(cx - 70, cy + 50, 13, tailFlameH - 6);

            ctx.fillStyle = '#9d0208';
            ctx.fillRect(cx - 60, cy + 20, 18, 24);
            ctx.fillRect(cx + 42, cy + 20, 18, 24);

            ctx.fillStyle = '#9d0208';
            ctx.fillRect(cx - 30, cy + 84, 16, 12);
            ctx.fillRect(cx + 14, cy + 84, 16, 12);
        }

        function animate() {
            animFrame += 0.12;
            const breath = Math.sin(animFrame * 1.1) * 2.8;
            const flameFlicker = Math.sin(animFrame * 4.5) * 3.2 + (Math.random() - 0.5) * 1.4;

            const avg = (pet.hunger + pet.happiness + pet.cleanliness + pet.energy) / 4;
            let mood = (avg >= 50) ? 'happy' : 'sad';

            drawPet(mood, breath, flameFlicker);
            requestAnimationFrame(animate);
        }

        function updatePetVisual() {
            const avg = (pet.hunger + pet.happiness + pet.cleanliness + pet.energy) / 4;
            let moodText = 'VERY HAPPY';
            let moodColor = '#22c55e';

            if (avg >= 80) {
                moodText = 'VERY HAPPY';
                moodColor = '#22c55e';
            } else if (avg >= 60) {
                moodText = 'HAPPY';
                moodColor = '#22c55e';
            } else if (avg >= 40) {
                moodText = 'NEEDS CARE';
                moodColor = '#f59e0b';
            } else {
                moodText = 'STRUGGLING';
                moodColor = '#ef4444';
            }

            const moodEl = document.getElementById('petMood');
            moodEl.textContent = moodText;
            moodEl.style.color = moodColor;
        }

        function savePet() {
            localStorage.setItem('virtualPet', JSON.stringify(pet));
            localStorage.setItem('virtualPetMessages', JSON.stringify(messages));
        }

        function loadPet() {
            const saved = localStorage.getItem('virtualPet');
            if (saved) pet = { ...pet, ...JSON.parse(saved) };
            const savedMsg = localStorage.getItem('virtualPetMessages');
            if (savedMsg) messages = JSON.parse(savedMsg);
        }

        function updateUI() {
            document.getElementById('hungerValue').textContent = Math.round(pet.hunger);
            document.getElementById('happinessValue').textContent = Math.round(pet.happiness);
            document.getElementById('cleanValue').textContent = Math.round(pet.cleanliness);
            document.getElementById('energyValue').textContent = Math.round(pet.energy);
            document.getElementById('ageValue').textContent = Math.floor(pet.age);
            document.getElementById('petNameDisplay').textContent = pet.name;

            updatePetVisual();
        }

        function addMessage(text) {
            messages.unshift(text);
            if (messages.length > 4) messages.pop();
            const el = document.getElementById('statusMessage');
            el.textContent = text;
            savePet();
        }

        function feedPet() {
            if (pet.hunger >= 95) { addMessage(`${pet.name} is already full!`); return; }
            pet.hunger = Math.min(100, pet.hunger + 22);
            pet.happiness = Math.min(100, pet.happiness + 5);
            pet.energy = Math.max(0, pet.energy - 3);
            addMessage(`You fed ${pet.name}.`);
            updateUI(); savePet(); checkLow();
        }

        function playWithPet() {
            if (pet.energy < 15) { addMessage(`${pet.name} is too tired.`); return; }
            pet.happiness = Math.min(100, pet.happiness + 25);
            pet.hunger = Math.max(0, pet.hunger - 8);
            pet.energy = Math.max(0, pet.energy - 18);
            pet.cleanliness = Math.max(0, pet.cleanliness - 5);
            addMessage(`You played with ${pet.name}!`);
            updateUI(); savePet(); checkLow();
        }

        function cleanPet() {
            if (pet.cleanliness >= 95) { addMessage(`${pet.name} is already clean.`); return; }
            pet.cleanliness = Math.min(100, pet.cleanliness + 28);
            pet.happiness = Math.min(100, pet.happiness + 8);
            pet.energy = Math.max(0, pet.energy - 5);
            addMessage(`You cleaned ${pet.name}.`);
            updateUI(); savePet(); checkLow();
        }

        function restPet() {
            if (pet.energy >= 95) { addMessage(`${pet.name} isn't tired.`); return; }
            pet.energy = Math.min(100, pet.energy + 32);
            pet.hunger = Math.max(0, pet.hunger - 5);
            pet.happiness = Math.min(100, pet.happiness + 4);
            addMessage(`${pet.name} rested.`);
            updateUI(); savePet(); checkLow();
        }

        function checkLow() {
            const low = [];
            if (pet.hunger <= 15) low.push('hungry');
            if (pet.happiness <= 15) low.push('unhappy');
            if (pet.cleanliness <= 15) low.push('dirty');
            if (pet.energy <= 15) low.push('exhausted');
            if (low.length) {
                const el = document.getElementById('statusMessage');
                el.textContent = `${pet.name} is ${low.join(' and ')}!`;
            }
        }

        function decayStats() {
            const r = 1.05;
            pet.hunger = Math.max(0, pet.hunger - r * 0.85);
            pet.happiness = Math.max(0, pet.happiness - r * 0.75);
            pet.cleanliness = Math.max(0, pet.cleanliness - r * 0.55);
            pet.energy = Math.max(0, pet.energy - r * 0.65);
            if (Math.random() < 0.05) pet.happiness = Math.max(0, pet.happiness - 3);
            if (Math.random() < 0.08) pet.age += 0.08;
            updateUI(); savePet(); checkLow();
        }

        function startDecay() {
            if (decayInterval) clearInterval(decayInterval);
            decayInterval = setInterval(decayStats, 6500);
        }

        function resetPet() {
            if (!confirm('Reset your pet?')) return;
            pet = { name: "Pixel", hunger: 80, happiness: 75, cleanliness: 85, energy: 90, age: 0 };
            messages = [];
            localStorage.removeItem('virtualPet');
            localStorage.removeItem('virtualPetMessages');
            updateUI();
            document.getElementById('statusMessage').textContent = 'Fresh start!';
        }

        function init() {
            loadPet();
            document.getElementById('petNameDisplay').textContent = pet.name;
            updateUI();
            const msgEl = document.getElementById('statusMessage');
            if (messages.length === 0) msgEl.textContent = `Welcome! Take good care of ${pet.name}.`;
            else msgEl.textContent = messages[0] || 'Welcome back!';
            startDecay();

            // Draw immediately + start animation
            drawPet('happy');
            requestAnimationFrame(animate);
        }

        window.onload = init;
    </script>
</body>
</html>
