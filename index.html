<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Virtual Pet</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        :root {
            --bg: #0a0f1e;
        }
        
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background: var(--bg);
            color: #e2e8f0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }
        .app {
            max-width: 420px;
            margin: 0 auto;
            padding: 14px 12px;
            padding-top: max(14px, env(safe-area-inset-top));
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 0 6px;
        }
        .title {
            font-family: 'Press Start 2P', system-ui;
            font-size: 18px;
            font-weight: 700;
            color: #22c55e;
            letter-spacing: 0.5px;
            margin: 0;
        }
        .version {
            font-size: 9px;
            color: #64748b;
            margin-left: 6px;
        }
        .reset-btn {
            background: #3f1f1f;
            color: #fda4af;
            border: none;
            padding: 5px 11px;
            border-radius: 999px;
            font-size: 9px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .device-frame {
            background: #161b2e;
            border: 6px solid #475569;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 12px 35px -10px rgb(0 0 0 / 0.5);
        }

        .stats-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 8px;
            font-size: 13px;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stat-item span:last-child {
            font-weight: 700;
            font-size: 14px;
        }

        .pet-screen {
            background: #0f172a;
            border: 5px solid #475569;
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 14px;
            display: flex;
            justify-content: center;
        }
        #petCanvas {
            image-rendering: pixelated;
            background: #1e2937;
            border-radius: 10px;
        }

        .pet-status {
            text-align: center;
            margin-bottom: 12px;
        }
        .mood { font-size: 13px; font-weight: 700; letter-spacing: 1px; }
        .age { font-size: 11px; color: #64748b; }

        .action-row {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }
        .action-btn {
            flex: 1;
            background: #1e2937;
            border: 2px solid #475569;
            border-radius: 12px;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .action-btn:active { background: #334155; }
        .action-icon { font-size: 24px; }
        .action-label { font-size: 12px; font-weight: 700; }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <div class="header">
            <div style="display:flex; align-items:flex-end;">
                <h1 class="title">VIRTUAL PET</h1>
                <span class="version">v2.0</span>
            </div>
            <button onclick="resetPet()" class="reset-btn">
                <span>↻</span>
                <span style="font-size:9px">RESET</span>
            </button>
        </div>

        <!-- Framed device -->
        <div class="device-frame">

            <!-- Top stats -->
            <div class="stats-top">
                <div class="stat-item">
                    <span>🍎</span>
                    <span id="hungerValue">80</span>
                </div>
                <div class="stat-item">
                    <span>❤️</span>
                    <span id="happinessValue">75</span>
                </div>
                <div class="stat-item">
                    <span>🧼</span>
                    <span id="cleanValue">85</span>
                </div>
                <div class="stat-item">
                    <span>⚡</span>
                    <span id="energyValue">90</span>
                </div>
            </div>

            <!-- Pet screen -->
            <div class="pet-screen">
                <canvas id="petCanvas" width="220" height="220"></canvas>
            </div>

            <!-- Status -->
            <div class="pet-status">
                <div id="petMood" class="mood" style="color:#22c55e;">VERY HAPPY</div>
                <div class="age">Age: <span id="ageValue">0</span> days • <span id="petNameDisplay">Pixel</span></div>
            </div>

            <!-- Action buttons -->
            <div class="action-row">
                <button onclick="feedPet()" class="action-btn">
                    <div class="action-icon">🍎</div>
                    <div class="action-label">Feed</div>
                </button>
                <button onclick="playWithPet()" class="action-btn">
                    <div class="action-icon">🎮</div>
                    <div class="action-label">Play</div>
                </button>
                <button onclick="cleanPet()" class="action-btn">
                    <div class="action-icon">🧼</div>
                    <div class="action-label">Clean</div>
                </button>
                <button onclick="restPet()" class="action-btn">
                    <div class="action-icon">🛏️</div>
                    <div class="action-label">Rest</div>
                </button>
            </div>

        </div>
    </div>

    <script>
        let pet = { name: "Pixel", hunger: 80, happiness: 75, cleanliness: 85, energy: 90, age: 0 };
        let messages = [];
        let decayInterval = null;
        let animFrame = 0;

        const canvas = document.getElementById('petCanvas');
        const ctx = canvas.getContext('2d', { alpha: true });

        // Baby-stage Ember (Flick) - Round, cute, big head, minimal details
        function drawPet(mood, breathOffset = 0, flameFlicker = 0) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.imageSmoothingEnabled = false;

            const cx = 110;
            const cy = 120 + breathOffset;

            // Soft shadow
            ctx.fillStyle = 'rgba(0,0,0,0.25)';
            ctx.beginPath();
            ctx.ellipse(cx, cy + 72, 48, 14, 0, 0, Math.PI * 2);
            ctx.fill();

            // Round chubby body (baby proportions)
            ctx.fillStyle = '#e85d04';
            ctx.beginPath();
            ctx.ellipse(cx, cy + 25, 42, 38, 0, 0, Math.PI * 2);
            ctx.fill();

            // Belly highlight
            ctx.fillStyle = '#faa307';
            ctx.beginPath();
            ctx.ellipse(cx, cy + 32, 28, 24, 0, 0, Math.PI * 2);
            ctx.fill();

            // Big baby head
            ctx.fillStyle = '#e85d04';
            ctx.beginPath();
            ctx.ellipse(cx, cy - 18, 48, 42, 0, 0, Math.PI * 2);
            ctx.fill();

            // Snout
            ctx.fillStyle = '#faa307';
            ctx.beginPath();
            ctx.ellipse(cx, cy + 2, 22, 16, 0, 0, Math.PI * 2);
            ctx.fill();

            // Big expressive eyes
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(cx - 22, cy - 28, 14, 14);
            ctx.fillRect(cx + 8, cy - 28, 14, 14);

            ctx.fillStyle = '#111111';
            ctx.fillRect(cx - 18, cy - 24, 6, 6);
            ctx.fillRect(cx + 12, cy - 24, 6, 6);

            // Mood expression (eyebrows)
            ctx.strokeStyle = '#111111';
            ctx.lineWidth = 2.5;
            if (mood === 'happy') {
                ctx.beginPath();
                ctx.arc(cx - 15, cy - 34, 5, Math.PI, 0);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx + 15, cy - 34, 5, Math.PI, 0);
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.moveTo(cx - 22, cy - 32);
                ctx.lineTo(cx - 10, cy - 28);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx + 10, cy - 28);
                ctx.lineTo(cx + 22, cy - 32);
                ctx.stroke();
            }

            // Tiny baby horns
            ctx.fillStyle = '#9d0208';
            ctx.fillRect(cx - 28, cy - 48, 8, 10);
            ctx.fillRect(cx + 20, cy - 48, 8, 10);

            // Small cute flame on head
            const flameH = 12 + flameFlicker * 0.6;
            ctx.fillStyle = '#ffba08';
            ctx.fillRect(cx - 6, cy - 52, 12, flameH);
            ctx.fillStyle = '#e85d04';
            ctx.fillRect(cx - 3, cy - 48, 6, flameH - 4);

            // Tiny stubby tail
            ctx.fillStyle = '#e85d04';
            ctx.fillRect(cx - 52, cy + 30, 18, 12);

            // Small tail flame
            ctx.fillStyle = '#ffba08';
            ctx.fillRect(cx - 56, cy + 28, 12, 10);
            ctx.fillStyle = '#e85d04';
            ctx.fillRect(cx - 53, cy + 30, 7, 6);

            // Minimal baby feet
            ctx.fillStyle = '#9d0208';
            ctx.fillRect(cx - 22, cy + 58, 12, 8);
            ctx.fillRect(cx + 10, cy + 58, 12, 8);
        }

        function animate() {
            animFrame += 0.12;
            const breath = Math.sin(animFrame * 1.0) * 2.2;
            const flameFlicker = Math.sin(animFrame * 3.8) * 2.5 + (Math.random() - 0.5) * 1.0;

            const avg = (pet.hunger + pet.happiness + pet.cleanliness + pet.energy) / 4;
            let mood = (avg >= 50) ? 'happy' : 'sad';

            drawPet(mood, breath, flameFlicker);
            requestAnimationFrame(animate);
        }

        function updatePetVisual() {
            const avg = (pet.hunger + pet.happiness + pet.cleanliness + pet.energy) / 4;
            let moodText = 'VERY HAPPY';
            let moodColor = '#22c55e';

            if (avg >= 80) {
                moodText = 'VERY HAPPY';
                moodColor = '#22c55e';
            } else if (avg >= 60) {
                moodText = 'HAPPY';
                moodColor = '#22c55e';
            } else if (avg >= 40) {
                moodText = 'NEEDS CARE';
                moodColor = '#f59e0b';
            } else {
                moodText = 'STRUGGLING';
                moodColor = '#ef4444';
            }

            const moodEl = document.getElementById('petMood');
            moodEl.textContent = moodText;
            moodEl.style.color = moodColor;
        }

        function savePet() {
            localStorage.setItem('virtualPet', JSON.stringify(pet));
        }

        function loadPet() {
            const saved = localStorage.getItem('virtualPet');
            if (saved) pet = { ...pet, ...JSON.parse(saved) };
        }

        function updateUI() {
            document.getElementById('hungerValue').textContent = Math.round(pet.hunger);
            document.getElementById('happinessValue').textContent = Math.round(pet.happiness);
            document.getElementById('cleanValue').textContent = Math.round(pet.cleanliness);
            document.getElementById('energyValue').textContent = Math.round(pet.energy);
            document.getElementById('ageValue').textContent = Math.floor(pet.age);
            document.getElementById('petNameDisplay').textContent = pet.name;

            updatePetVisual();
        }

        function feedPet() {
            if (pet.hunger >= 95) return;
            pet.hunger = Math.min(100, pet.hunger + 22);
            pet.happiness = Math.min(100, pet.happiness + 5);
            pet.energy = Math.max(0, pet.energy - 3);
            updateUI();
            savePet();
        }

        function playWithPet() {
            if (pet.energy < 15) return;
            pet.happiness = Math.min(100, pet.happiness + 25);
            pet.hunger = Math.max(0, pet.hunger - 8);
            pet.energy = Math.max(0, pet.energy - 18);
            pet.cleanliness = Math.max(0, pet.cleanliness - 5);
            updateUI();
            savePet();
        }

        function cleanPet() {
            if (pet.cleanliness >= 95) return;
            pet.cleanliness = Math.min(100, pet.cleanliness + 28);
            pet.happiness = Math.min(100, pet.happiness + 8);
            pet.energy = Math.max(0, pet.energy - 5);
            updateUI();
            savePet();
        }

        function restPet() {
            if (pet.energy >= 95) return;
            pet.energy = Math.min(100, pet.energy + 32);
            pet.hunger = Math.max(0, pet.hunger - 5);
            pet.happiness = Math.min(100, pet.happiness + 4);
            updateUI();
            savePet();
        }

        function decayStats() {
            const r = 1.05;
            pet.hunger = Math.max(0, pet.hunger - r * 0.85);
            pet.happiness = Math.max(0, pet.happiness - r * 0.75);
            pet.cleanliness = Math.max(0, pet.cleanliness - r * 0.55);
            pet.energy = Math.max(0, pet.energy - r * 0.65);
            if (Math.random() < 0.05) pet.happiness = Math.max(0, pet.happiness - 3);
            if (Math.random() < 0.08) pet.age += 0.08;
            updateUI();
            savePet();
        }

        function startDecay() {
            if (decayInterval) clearInterval(decayInterval);
            decayInterval = setInterval(decayStats, 6500);
        }

        function resetPet() {
            if (!confirm('Reset your pet?')) return;
            pet = { name: "Pixel", hunger: 80, happiness: 75, cleanliness: 85, energy: 90, age: 0 };
            localStorage.removeItem('virtualPet');
            updateUI();
        }

        function init() {
            loadPet();
            document.getElementById('petNameDisplay').textContent = pet.name;
            updateUI();
            startDecay();

            drawPet('happy');
            requestAnimationFrame(animate);
        }

        window.onload = init;
    </script>
</body>
</html>
