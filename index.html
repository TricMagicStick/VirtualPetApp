<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Virtual Pet</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        :root {
            --bg: #0a0f1e;
            --frame: #1a1f35;
            --border: #334155;
        }
        
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background: var(--bg);
            color: #e2e8f0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }
        .app {
            max-width: 380px;
            margin: 0 auto;
            padding: 16px 14px;
            padding-top: max(16px, env(safe-area-inset-top));
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 0 6px;
        }
        .title {
            font-family: 'Press Start 2P', system-ui;
            font-size: 18px;
            font-weight: 700;
            color: #22c55e;
            letter-spacing: 0.5px;
            margin: 0;
        }
        .version {
            font-size: 9px;
            color: #64748b;
            margin-left: 6px;
        }
        .reset-btn {
            background: #3f1f1f;
            color: #fda4af;
            border: none;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 9px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .device-frame {
            background: #161b2e;
            border: 5px solid #475569;
            border-radius: 18px;
            padding: 14px;
            box-shadow: 0 10px 30px -8px rgb(0 0 0 / 0.5);
        }

        .stats-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 6px;
            font-size: 12px;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .stat-item span:last-child {
            font-weight: 700;
            font-size: 13px;
        }

        .pet-screen {
            background: #0f172a;
            border: 4px solid #475569;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #petCanvas {
            image-rendering: pixelated;
            background: #1e2937;
            border-radius: 8px;
        }

        .pet-status {
            text-align: center;
            margin-bottom: 10px;
        }
        .mood { font-size: 12px; font-weight: 700; letter-spacing: 1px; }
        .age { font-size: 10px; color: #64748b; }

        .action-row {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }
        .action-btn {
            flex: 1;
            background: #1e2937;
            border: 2px solid #475569;
            border-radius: 10px;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .action-btn:active { background: #334155; }
        .action-icon { font-size: 22px; }
        .action-label { font-size: 11px; font-weight: 700; }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <div class="header">
            <div style="display:flex; align-items:flex-end;">
                <h1 class="title">VIRTUAL PET</h1>
                <span class="version">v1.6</span>
            </div>
            <button onclick="resetPet()" class="reset-btn">
                <span>↻</span>
                <span style="font-size:9px">RESET</span>
            </button>
        </div>

        <!-- Framed device -->
        <div class="device-frame">

            <!-- Top stats -->
            <div class="stats-top">
                <div class="stat-item">
                    <span>🍎</span>
                    <span id="hungerValue">80</span>
                </div>
                <div class="stat-item">
                    <span>❤️</span>
                    <span id="happinessValue">75</span>
                </div>
                <div class="stat-item">
                    <span>🧼</span>
                    <span id="cleanValue">85</span>
                </div>
                <div class="stat-item">
                    <span>⚡</span>
                    <span id="energyValue">90</span>
                </div>
            </div>

            <!-- Pet area -->
            <div class="pet-screen">
                <canvas id="petCanvas" width="200" height="200"></canvas>
            </div>

            <!-- Status -->
            <div class="pet-status">
                <div id="petMood" class="mood" style="color:#22c55e;">VERY HAPPY</div>
                <div class="age">Age: <span id="ageValue">0</span> days • <span id="petNameDisplay">Pixel</span></div>
            </div>

            <!-- Action buttons -->
            <div class="action-row">
                <button onclick="feedPet()" class="action-btn">
                    <div class="action-icon">🍎</div>
                    <div class="action-label">Feed</div>
                </button>
                <button onclick="playWithPet()" class="action-btn">
                    <div class="action-icon">🎮</div>
                    <div class="action-label">Play</div>
                </button>
                <button onclick="cleanPet()" class="action-btn">
                    <div class="action-icon">🧼</div>
                    <div class="action-label">Clean</div>
                </button>
                <button onclick="restPet()" class="action-btn">
                    <div class="action-icon">🛏️</div>
                    <div class="action-label">Rest</div>
                </button>
            </div>

        </div>
    </div>

    <script>
        let pet = { name: "Pixel", hunger: 80, happiness: 75, cleanliness: 85, energy: 90, age: 0 };
        let messages = [];
        let decayInterval = null;
        let animFrame = 0;

        const canvas = document.getElementById('petCanvas');
        const ctx = canvas.getContext('2d', { alpha: true });

        function drawPet(mood, breathOffset = 0, flameFlicker = 0) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.imageSmoothingEnabled = false;

            const cx = 100;
            const cy = 105 + breathOffset;

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(cx, cy + 78, 52, 16, 0, 0, Math.PI * 2);
            ctx.fill();

            // Body
            ctx.fillStyle = '#e85d04';
            ctx.fillRect(cx - 38, cy + 12, 76, 66);

            // Belly
            ctx.fillStyle = '#faa307';
            ctx.fillRect(cx - 26, cy + 30, 52, 40);

            // Head
            ctx.fillStyle = '#e85d04';
            ctx.fillRect(cx - 40, cy - 40, 80, 58);

            // Snout
            ctx.fillStyle = '#faa307';
            ctx.fillRect(cx - 24, cy + 8, 48, 22);

            // Eyes
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(cx - 26, cy - 26, 14, 14);
            ctx.fillRect(cx + 12, cy - 26, 14, 14);

            ctx.fillStyle = '#111111';
            ctx.fillRect(cx - 21, cy - 21, 6, 6);
            ctx.fillRect(cx + 17, cy - 21, 6, 6);

            // Eyebrows
            ctx.strokeStyle = '#111111';
            ctx.lineWidth = 2.5;
            if (mood === 'happy') {
                ctx.beginPath();
                ctx.arc(cx - 19, cy - 32, 6, Math.PI, 0);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx + 19, cy - 32, 6, Math.PI, 0);
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.moveTo(cx - 26, cy - 30);
                ctx.lineTo(cx - 12, cy - 24);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx + 12, cy - 24);
                ctx.lineTo(cx + 26, cy - 30);
                ctx.stroke();
            }

            // Horns
            ctx.fillStyle = '#9d0208';
            ctx.fillRect(cx - 38, cy - 52, 11, 18);
            ctx.fillRect(cx + 27, cy - 52, 11, 18);

            // Head flame
            const flameHeight = 18 + flameFlicker;
            ctx.fillStyle = '#ffba08';
            ctx.fillRect(cx - 9, cy - 60, 18, flameHeight);
            ctx.fillStyle = '#e85d04';
            ctx.fillRect(cx - 5, cy - 55, 10, flameHeight - 5);

            // Tail
            ctx.fillStyle = '#e85d04';
            ctx.fillRect(cx - 60, cy + 42, 26, 16);

            // Tail flame
            const tailFlameH = 18 + flameFlicker * 0.9;
            ctx.fillStyle = '#ffba08';
            ctx.fillRect(cx - 68, cy + 40, 20, tailFlameH);
            ctx.fillStyle = '#e85d04';
            ctx.fillRect(cx - 64, cy + 44, 12, tailFlameH - 5);

            // Wings
            ctx.fillStyle = '#9d0208';
            ctx.fillRect(cx - 55, cy + 18, 16, 22);
            ctx.fillRect(cx + 39, cy + 18, 16, 22);

            // Feet
            ctx.fillStyle = '#9d0208';
            ctx.fillRect(cx - 28, cy + 76, 14, 11);
            ctx.fillRect(cx + 14, cy + 76, 14, 11);
        }

        function animate() {
            animFrame += 0.12;
            const breath = Math.sin(animFrame * 1.1) * 2.5;
            const flameFlicker = Math.sin(animFrame * 4.5) * 3 + (Math.random() - 0.5) * 1.3;

            const avg = (pet.hunger + pet.happiness + pet.cleanliness + pet.energy) / 4;
            let mood = (avg >= 50) ? 'happy' : 'sad';

            drawPet(mood, breath, flameFlicker);
            requestAnimationFrame(animate);
        }

        function updatePetVisual() {
            const avg = (pet.hunger + pet.happiness + pet.cleanliness + pet.energy) / 4;
            let moodText = 'VERY HAPPY';
            let moodColor = '#22c55e';

            if (avg >= 80) {
                moodText = 'VERY HAPPY';
                moodColor = '#22c55e';
            } else if (avg >= 60) {
                moodText = 'HAPPY';
                moodColor = '#22c55e';
            } else if (avg >= 40) {
                moodText = 'NEEDS CARE';
                moodColor = '#f59e0b';
            } else {
                moodText = 'STRUGGLING';
                moodColor = '#ef4444';
            }

            const moodEl = document.getElementById('petMood');
            moodEl.textContent = moodText;
            moodEl.style.color = moodColor;
        }

        function savePet() {
            localStorage.setItem('virtualPet', JSON.stringify(pet));
            localStorage.setItem('virtualPetMessages', JSON.stringify(messages));
        }

        function loadPet() {
            const saved = localStorage.getItem('virtualPet');
            if (saved) pet = { ...pet, ...JSON.parse(saved) };
            const savedMsg = localStorage.getItem('virtualPetMessages');
            if (savedMsg) messages = JSON.parse(savedMsg);
        }

        function updateUI() {
            document.getElementById('hungerValue').textContent = Math.round(pet.hunger);
            document.getElementById('happinessValue').textContent = Math.round(pet.happiness);
            document.getElementById('cleanValue').textContent = Math.round(pet.cleanliness);
            document.getElementById('energyValue').textContent = Math.round(pet.energy);
            document.getElementById('ageValue').textContent = Math.floor(pet.age);
            document.getElementById('petNameDisplay').textContent = pet.name;

            updatePetVisual();
        }

        function addMessage(text) {
            messages.unshift(text);
            if (messages.length > 4) messages.pop();
            const el = document.getElementById('statusMessage');
            el.textContent = text;
            savePet();
        }

        function feedPet() {
            if (pet.hunger >= 95) { addMessage(`${pet.name} is already full!`); return; }
            pet.hunger = Math.min(100, pet.hunger + 22);
            pet.happiness = Math.min(100, pet.happiness + 5);
            pet.energy = Math.max(0, pet.energy - 3);
            addMessage(`You fed ${pet.name}.`);
            updateUI(); savePet(); checkLow();
        }

        function playWithPet() {
            if (pet.energy < 15) { addMessage(`${pet.name} is too tired.`); return; }
            pet.happiness = Math.min(100, pet.happiness + 25);
            pet.hunger = Math.max(0, pet.hunger - 8);
            pet.energy = Math.max(0, pet.energy - 18);
            pet.cleanliness = Math.max(0, pet.cleanliness - 5);
            addMessage(`You played with ${pet.name}!`);
            updateUI(); savePet(); checkLow();
        }

        function cleanPet() {
            if (pet.cleanliness >= 95) { addMessage(`${pet.name} is already clean.`); return; }
            pet.cleanliness = Math.min(100, pet.cleanliness + 28);
            pet.happiness = Math.min(100, pet.happiness + 8);
            pet.energy = Math.max(0, pet.energy - 5);
            addMessage(`You cleaned ${pet.name}.`);
            updateUI(); savePet(); checkLow();
        }

        function restPet() {
            if (pet.energy >= 95) { addMessage(`${pet.name} isn't tired.`); return; }
            pet.energy = Math.min(100, pet.energy + 30);
            pet.hunger = Math.max(0, pet.hunger - 5);
            pet.happiness = Math.min(100, pet.happiness + 4);
            addMessage(`${pet.name} rested.`);
            updateUI(); savePet(); checkLow();
        }

        function checkLow() {
            const low = [];
            if (pet.hunger <= 15) low.push('hungry');
            if (pet.happiness <= 15) low.push('unhappy');
            if (pet.cleanliness <= 15) low.push('dirty');
            if (pet.energy <= 15) low.push('exhausted');
            if (low.length) {
                const el = document.getElementById('statusMessage');
                el.textContent = `${pet.name} is ${low.join(' and ')}!`;
            }
        }

        function decayStats() {
            const r = 1.05;
            pet.hunger = Math.max(0, pet.hunger - r * 0.85);
            pet.happiness = Math.max(0, pet.happiness - r * 0.75);
            pet.cleanliness = Math.max(0, pet.cleanliness - r * 0.55);
            pet.energy = Math.max(0, pet.energy - r * 0.65);
            if (Math.random() < 0.05) pet.happiness = Math.max(0, pet.happiness - 3);
            if (Math.random() < 0.08) pet.age += 0.08;
            updateUI(); savePet(); checkLow();
        }

        function startDecay() {
            if (decayInterval) clearInterval(decayInterval);
            decayInterval = setInterval(decayStats, 6500);
        }

        function resetPet() {
            if (!confirm('Reset your pet?')) return;
            pet = { name: "Pixel", hunger: 80, happiness: 75, cleanliness: 85, energy: 90, age: 0 };
            messages = [];
            localStorage.removeItem('virtualPet');
            localStorage.removeItem('virtualPetMessages');
            updateUI();
            document.getElementById('statusMessage').textContent = 'Fresh start!';
        }

        function init() {
            loadPet();
            document.getElementById('petNameDisplay').textContent = pet.name;
            updateUI();
            const msgEl = document.getElementById('statusMessage');
            if (messages.length === 0) msgEl.textContent = `Welcome! Take good care of ${pet.name}.`;
            else msgEl.textContent = messages[0] || 'Welcome back!';
            startDecay();
            requestAnimationFrame(animate);
        }

        window.onload = init;
    </script>
</body>
</html>
