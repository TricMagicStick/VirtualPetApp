<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Virtual Pet</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        :root {
            --bg: #0a0f1e;
        }
        
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background: var(--bg);
            color: #e2e8f0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }
        .app {
            max-width: 420px;
            margin: 0 auto;
            padding: 14px 12px;
            padding-top: max(14px, env(safe-area-inset-top));
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 0 6px;
        }
        .title {
            font-family: 'Press Start 2P', system-ui;
            font-size: 18px;
            font-weight: 700;
            color: #22c55e;
            letter-spacing: 0.5px;
            margin: 0;
        }
        .version {
            font-size: 9px;
            color: #64748b;
            margin-left: 6px;
        }
        .reset-btn {
            background: #3f1f1f;
            color: #fda4af;
            border: none;
            padding: 5px 11px;
            border-radius: 999px;
            font-size: 9px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .device-frame {
            background: #161b2e;
            border: 6px solid #475569;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 12px 35px -10px rgb(0 0 0 / 0.5);
        }

        .stats-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 8px;
            font-size: 13px;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stat-item span:last-child {
            font-weight: 700;
            font-size: 14px;
        }

        .pet-screen {
            background: #0f172a;
            border: 5px solid #475569;
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 14px;
            display: flex;
            justify-content: center;
        }
        #petCanvas {
            image-rendering: pixelated;
            background: #1e2937;
            border-radius: 10px;
        }

        .pet-status {
            text-align: center;
            margin-bottom: 12px;
        }
        .mood { font-size: 13px; font-weight: 700; letter-spacing: 1px; }
        .age { font-size: 11px; color: #64748b; }

        .action-row {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }
        .action-btn {
            flex: 1;
            background: #1e2937;
            border: 2px solid #475569;
            border-radius: 12px;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .action-btn:active { background: #334155; }
        .action-icon { font-size: 24px; }
        .action-label { font-size: 12px; font-weight: 700; }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <div class="header">
            <div style="display:flex; align-items:flex-end;">
                <h1 class="title">VIRTUAL PET</h1>
                <span class="version">v2.4</span>
            </div>
            <button onclick="resetPet()" class="reset-btn">
                <span>↻</span>
                <span style="font-size:9px">RESET</span>
            </button>
        </div>

        <!-- Framed device -->
        <div class="device-frame">

            <!-- Top stats -->
            <div class="stats-top">
                <div class="stat-item">
                    <span>🍎</span>
                    <span id="hungerValue">80</span>
                </div>
                <div class="stat-item">
                    <span>❤️</span>
                    <span id="happinessValue">75</span>
                </div>
                <div class="stat-item">
                    <span>🧼</span>
                    <span id="cleanValue">85</span>
                </div>
                <div class="stat-item">
                    <span>⚡</span>
                    <span id="energyValue">90</span>
                </div>
            </div>

            <!-- Pet screen -->
            <div class="pet-screen">
                <canvas id="petCanvas" width="220" height="220"></canvas>
            </div>

            <!-- Status -->
            <div class="pet-status">
                <div id="petMood" class="mood" style="color:#22c55e;">VERY HAPPY</div>
                <div class="age">Age: <span id="ageValue">0</span> days • <span id="petNameDisplay">Pixel</span></div>
            </div>

            <!-- Action buttons -->
            <div class="action-row">
                <button onclick="feedPet()" class="action-btn">
                    <div class="action-icon">🍎</div>
                    <div class="action-label">Feed</div>
                </button>
                <button onclick="playWithPet()" class="action-btn">
                    <div class="action-icon">🎮</div>
                    <div class="action-label">Play</div>
                </button>
                <button onclick="cleanPet()" class="action-btn">
                    <div class="action-icon">🧼</div>
                    <div class="action-label">Clean</div>
                </button>
                <button onclick="restPet()" class="action-btn">
                    <div class="action-icon">🛏️</div>
                    <div class="action-label">Rest</div>
                </button>
            </div>

            <!-- Stage switcher -->
            <div style="margin-top: 10px; display: flex; gap: 6px; justify-content: center;">
                <button onclick="setStage(0)" style="font-size:10px; padding:4px 8px;">Baby</button>
                <button onclick="setStage(1)" style="font-size:10px; padding:4px 8px;">Child</button>
                <button onclick="setStage(2)" style="font-size:10px; padding:4px 8px;">Adult</button>
                <button onclick="setStage(3)" style="font-size:10px; padding:4px 8px;">Ultimate</button>
            </div>

        </div>
    </div>

    <script>
        let pet = { name: "Pixel", hunger: 80, happiness: 75, cleanliness: 85, energy: 90, age: 0 };
        let messages = [];
        let decayInterval = null;
        let animFrame = 0;
        let currentStage = 0;

        const canvas = document.getElementById('petCanvas');
        const ctx = canvas.getContext('2d', { alpha: true });

        // STAGE 0: FLICK (Baby) - Round cute blob, big head, tiny body
        function drawFlick(mood, breathOffset, flameFlicker) {
            const cx = 110;
            const cy = 125 + breathOffset;

            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(cx, cy + 68, 40, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#e85d04';
            ctx.beginPath();
            ctx.ellipse(cx, cy + 22, 32, 30, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#faa307';
            ctx.beginPath();
            ctx.ellipse(cx, cy + 26, 20, 18, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#e85d04';
            ctx.beginPath();
            ctx.ellipse(cx, cy - 22, 52, 46, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#faa307';
            ctx.beginPath();
            ctx.ellipse(cx, cy - 2, 18, 14, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(cx - 24, cy - 30, 16, 16);
            ctx.fillRect(cx + 8, cy - 30, 16, 16);

            ctx.fillStyle = '#111111';
            ctx.fillRect(cx - 20, cy - 26, 8, 8);
            ctx.fillRect(cx + 12, cy - 26, 8, 8);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(cx - 18, cy - 28, 3, 3);
            ctx.fillRect(cx + 14, cy - 28, 3, 3);

            ctx.strokeStyle = '#111111';
            ctx.lineWidth = 2;
            if (mood === 'happy') {
                ctx.beginPath();
                ctx.arc(cx - 16, cy - 36, 5, Math.PI, 0);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx + 16, cy - 36, 5, Math.PI, 0);
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.moveTo(cx - 24, cy - 34);
                ctx.lineTo(cx - 12, cy - 30);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx + 12, cy - 30);
                ctx.lineTo(cx + 24, cy - 34);
                ctx.stroke();
            }

            ctx.fillStyle = '#9d0208';
            ctx.fillRect(cx - 30, cy - 52, 7, 9);
            ctx.fillRect(cx + 23, cy - 52, 7, 9);

            const flameH = 11 + flameFlicker * 0.5;
            ctx.fillStyle = '#ffba08';
            ctx.fillRect(cx - 5, cy - 56, 10, flameH);
            ctx.fillStyle = '#e85d04';
            ctx.fillRect(cx - 2, cy - 52, 5, flameH - 3);

            ctx.fillStyle = '#e85d04';
            ctx.fillRect(cx - 48, cy + 28, 14, 10);

            ctx.fillStyle = '#ffba08';
            ctx.fillRect(cx - 52, cy + 26, 10, 9);
            ctx.fillStyle = '#e85d04';
            ctx.fillRect(cx - 49, cy + 28, 5, 5);

            ctx.fillStyle = '#9d0208';
            ctx.fillRect(cx - 18, cy + 48, 10, 7);
            ctx.fillRect(cx + 8, cy + 48, 10, 7);
        }

        // STAGE 1: CHARLING (Child) - Body elongates, small wings + flame mane appear
        function drawCharling(mood, breathOffset, flameFlicker) {
            const cx = 110;
            const cy = 115 + breathOffset;

            ctx.fillStyle = 'rgba(0,0,0,0.25)';
            ctx.beginPath();
            ctx.ellipse(cx, cy + 75, 46, 13, 0, 0, Math.PI * 2);
            ctx.fill();

            // Body starting to elongate
            ctx.fillStyle = '#e85d04';
            ctx.beginPath();
            ctx.ellipse(cx, cy + 18, 40, 38, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#faa307';
            ctx.beginPath();
            ctx.ellipse(cx, cy + 24, 26, 24, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#e85d04';
            ctx.beginPath();
            ctx.ellipse(cx, cy - 16, 46, 40, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#faa307';
            ctx.beginPath();
            ctx.ellipse(cx, cy + 4, 20, 15, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(cx - 20, cy - 24, 13, 13);
            ctx.fillRect(cx + 7, cy - 24, 13, 13);

            ctx.fillStyle = '#111111';
            ctx.fillRect(cx - 16, cy - 20, 6, 6);
            ctx.fillRect(cx + 11, cy - 20, 6, 6);

            ctx.strokeStyle = '#111111';
            ctx.lineWidth = 2.5;
            if (mood === 'happy') {
                ctx.beginPath();
                ctx.arc(cx - 14, cy - 32, 5, Math.PI, 0);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx + 14, cy - 32, 5, Math.PI, 0);
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.moveTo(cx - 20, cy - 30);
                ctx.lineTo(cx - 10, cy - 26);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx + 10, cy - 26);
                ctx.lineTo(cx + 20, cy - 30);
                ctx.stroke();
            }

            ctx.fillStyle = '#9d0208';
            ctx.fillRect(cx - 26, cy - 46, 8, 11);
            ctx.fillRect(cx + 18, cy - 46, 8, 11);

            // Small wings appear
            ctx.fillStyle = '#9d0208';
            ctx.fillRect(cx - 44, cy + 6, 13, 18);
            ctx.fillRect(cx + 31, cy + 6, 13, 18);

            // Flame mane starts
            const flameH = 15 + flameFlicker * 0.6;
            ctx.fillStyle = '#ffba08';
            ctx.fillRect(cx - 7, cy - 52, 14, flameH);
            ctx.fillStyle = '#e85d04';
            ctx.fillRect(cx - 4, cy - 48, 8, flameH - 4);

            ctx.fillStyle = '#e85d04';
            ctx.fillRect(cx - 52, cy + 30, 20, 13);

            ctx.fillStyle = '#ffba08';
            ctx.fillRect(cx - 57, cy + 28, 13, 11);
            ctx.fillStyle = '#e85d04';
            ctx.fillRect(cx - 54, cy + 30, 7, 7);

            ctx.fillStyle = '#9d0208';
            ctx.fillRect(cx - 20, cy + 52, 11, 8);
            ctx.fillRect(cx + 9, cy + 52, 11, 8);
        }

        // STAGE 2: DRAKEMBER (Adult) - Proper dragon shape, full wings, neck visible
        function drawDrakEmber(mood, breathOffset, flameFlicker) {
            const cx = 110;
            const cy = 108 + breathOffset;

            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(cx, cy + 85, 52, 14, 0, 0, Math.PI * 2);
            ctx.fill();

            // Elongated dragon body
            ctx.fillStyle = '#e85d04';
            ctx.beginPath();
            ctx.ellipse(cx, cy + 10, 48, 46, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#faa307';
            ctx.beginPath();
            ctx.ellipse(cx, cy + 18, 30, 28, 0, 0, Math.PI * 2);
            ctx.fill();

            // Clear neck + head
            ctx.fillStyle = '#e85d04';
            ctx.beginPath();
            ctx.ellipse(cx, cy - 22, 44, 40, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#faa307';
            ctx.beginPath();
            ctx.ellipse(cx, cy + 2, 22, 16, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(cx - 18, cy - 24, 12, 12);
            ctx.fillRect(cx + 6, cy - 24, 12, 12);

            ctx.fillStyle = '#111111';
            ctx.fillRect(cx - 14, cy - 20, 5, 5);
            ctx.fillRect(cx + 10, cy - 20, 5, 5);

            ctx.strokeStyle = '#111111';
            ctx.lineWidth = 2.5;
            if (mood === 'happy') {
                ctx.beginPath();
                ctx.arc(cx - 12, cy - 32, 5, Math.PI, 0);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx + 12, cy - 32, 5, Math.PI, 0);
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.moveTo(cx - 18, cy - 30);
                ctx.lineTo(cx - 8, cy - 26);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx + 8, cy - 26);
                ctx.lineTo(cx + 18, cy - 30);
                ctx.stroke();
            }

            ctx.fillStyle = '#9d0208';
            ctx.fillRect(cx - 24, cy - 48, 9, 13);
            ctx.fillRect(cx + 15, cy - 48, 9, 13);

            // Full wings
            ctx.fillStyle = '#9d0208';
            ctx.fillRect(cx - 52, cy - 10, 20, 32);
            ctx.fillRect(cx + 32, cy - 10, 20, 32);

            const flameH = 17 + flameFlicker * 0.7;
            ctx.fillStyle = '#ffba08';
            ctx.fillRect(cx - 8, cy - 54, 16, flameH);
            ctx.fillStyle = '#e85d04';
            ctx.fillRect(cx - 5, cy - 50, 10, flameH - 5);

            ctx.fillStyle = '#e85d04';
            ctx.fillRect(cx - 58, cy + 32, 26, 16);

            ctx.fillStyle = '#ffba08';
            ctx.fillRect(cx - 64, cy + 30, 16, 14);
            ctx.fillStyle = '#e85d04';
            ctx.fillRect(cx - 60, cy + 32, 9, 10);

            ctx.fillStyle = '#9d0208';
            ctx.fillRect(cx - 22, cy + 54, 12, 10);
            ctx.fillRect(cx + 10, cy + 54, 12, 10);
        }

        // STAGE 3: INFERNYX (Ultimate) - Tall imposing silhouette, armor, massive wings
        function drawInfernyx(mood, breathOffset, flameFlicker) {
            const cx = 110;
            const cy = 100 + breathOffset;

            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.beginPath();
            ctx.ellipse(cx, cy + 92, 58, 15, 0, 0, Math.PI * 2);
            ctx.fill();

            // Taller, more vertical powerful body
            ctx.fillStyle = '#e85d04';
            ctx.beginPath();
            ctx.ellipse(cx, cy + 4, 50, 50, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#faa307';
            ctx.beginPath();
            ctx.ellipse(cx, cy + 14, 32, 30, 0, 0, Math.PI * 2);
            ctx.fill();

            // Strong head presence
            ctx.fillStyle = '#e85d04';
            ctx.beginPath();
            ctx.ellipse(cx, cy - 26, 48, 42, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#faa307';
            ctx.beginPath();
            ctx.ellipse(cx, cy - 2, 24, 17, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(cx - 18, cy - 26, 13, 13);
            ctx.fillRect(cx + 5, cy - 26, 13, 13);

            ctx.fillStyle = '#111111';
            ctx.fillRect(cx - 14, cy - 22, 6, 6);
            ctx.fillRect(cx + 9, cy - 22, 6, 6);

            ctx.strokeStyle = '#111111';
            ctx.lineWidth = 2.5;
            if (mood === 'happy') {
                ctx.beginPath();
                ctx.arc(cx - 12, cy - 34, 5, Math.PI, 0);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx + 12, cy - 34, 5, Math.PI, 0);
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.moveTo(cx - 18, cy - 32);
                ctx.lineTo(cx - 6, cy - 28);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx + 6, cy - 28);
                ctx.lineTo(cx + 18, cy - 32);
                ctx.stroke();
            }

            // Larger horns
            ctx.fillStyle = '#9d0208';
            ctx.fillRect(cx - 26, cy - 54, 11, 15);
            ctx.fillRect(cx + 15, cy - 54, 11, 15);

            // Massive dramatic wings (major silhouette change)
            ctx.fillStyle = '#9d0208';
            ctx.fillRect(cx - 62, cy - 24, 26, 42);
            ctx.fillRect(cx + 36, cy - 24, 26, 42);

            const flameH = 22 + flameFlicker * 1.0;
            ctx.fillStyle = '#ffba08';
            ctx.fillRect(cx - 10, cy - 62, 20, flameH);
            ctx.fillStyle = '#e85d04';
            ctx.fillRect(cx - 7, cy - 58, 14, flameH - 7);

            ctx.fillStyle = '#e85d04';
            ctx.fillRect(cx - 62, cy + 28, 30, 20);

            ctx.fillStyle = '#ffba08';
            ctx.fillRect(cx - 68, cy + 26, 20, 18);
            ctx.fillStyle = '#e85d04';
            ctx.fillRect(cx - 64, cy + 28, 12, 14);

            ctx.fillStyle = '#9d0208';
            ctx.fillRect(cx - 24, cy + 52, 15, 12);
            ctx.fillRect(cx + 9, cy + 52, 15, 12);
        }

        function drawPet(mood, breathOffset, flameFlicker) {
            if (currentStage === 0) drawFlick(mood, breathOffset, flameFlicker);
            else if (currentStage === 1) drawCharling(mood, breathOffset, flameFlicker);
            else if (currentStage === 2) drawDrakEmber(mood, breathOffset, flameFlicker);
            else if (currentStage === 3) drawInfernyx(mood, breathOffset, flameFlicker);
        }

        function setStage(stage) {
            currentStage = stage;
            const avg = (pet.hunger + pet.happiness + pet.cleanliness + pet.energy) / 4;
            let mood = (avg >= 50) ? 'happy' : 'sad';
            drawPet(mood, 0, 0);
        }

        function animate() {
            animFrame += 0.12;
            const breath = Math.sin(animFrame * 1.0) * 2.0;
            const flameFlicker = Math.sin(animFrame * 3.8) * 2.8 + (Math.random() - 0.5) * 1.0;

            const avg = (pet.hunger + pet.happiness + pet.cleanliness + pet.energy) / 4;
            let mood = (avg >= 50) ? 'happy' : 'sad';

            drawPet(mood, breath, flameFlicker);
            requestAnimationFrame(animate);
        }

        function updatePetVisual() {
            const avg = (pet.hunger + pet.happiness + pet.cleanliness + pet.energy) / 4;
            let moodText = 'VERY HAPPY';
            let moodColor = '#22c55e';

            if (avg >= 80) {
                moodText = 'VERY HAPPY';
                moodColor = '#22c55e';
            } else if (avg >= 60) {
                moodText = 'HAPPY';
                moodColor = '#22c55e';
            } else if (avg >= 40) {
                moodText = 'NEEDS CARE';
                moodColor = '#f59e0b';
            } else {
                moodText = 'STRUGGLING';
                moodColor = '#ef4444';
            }

            const moodEl = document.getElementById('petMood');
            moodEl.textContent = moodText;
            moodEl.style.color = moodColor;
        }

        function savePet() {
            localStorage.setItem('virtualPet', JSON.stringify(pet));
        }

        function loadPet() {
            const saved = localStorage.getItem('virtualPet');
            if (saved) pet = { ...pet, ...JSON.parse(saved) };
        }

        function updateUI() {
            document.getElementById('hungerValue').textContent = Math.round(pet.hunger);
            document.getElementById('happinessValue').textContent = Math.round(pet.happiness);
            document.getElementById('cleanValue').textContent = Math.round(pet.cleanliness);
            document.getElementById('energyValue').textContent = Math.round(pet.energy);
            document.getElementById('ageValue').textContent = Math.floor(pet.age);
            document.getElementById('petNameDisplay').textContent = pet.name;

            updatePetVisual();
        }

        function feedPet() {
            if (pet.hunger >= 95) return;
            pet.hunger = Math.min(100, pet.hunger + 22);
            pet.happiness = Math.min(100, pet.happiness + 5);
            pet.energy = Math.max(0, pet.energy - 3);
            updateUI();
            savePet();
        }

        function playWithPet() {
            if (pet.energy < 15) return;
            pet.happiness = Math.min(100, pet.happiness + 25);
            pet.hunger = Math.max(0, pet.hunger - 8);
            pet.energy = Math.max(0, pet.energy - 18);
            pet.cleanliness = Math.max(0, pet.cleanliness - 5);
            updateUI();
            savePet();
        }

        function cleanPet() {
            if (pet.cleanliness >= 95) return;
            pet.cleanliness = Math.min(100, pet.cleanliness + 28);
            pet.happiness = Math.min(100, pet.happiness + 8);
            pet.energy = Math.max(0, pet.energy - 5);
            updateUI();
            savePet();
        }

        function restPet() {
            if (pet.energy >= 95) return;
            pet.energy = Math.min(100, pet.energy + 32);
            pet.hunger = Math.max(0, pet.hunger - 5);
            pet.happiness = Math.min(100, pet.happiness + 4);
            updateUI();
            savePet();
        }

        function decayStats() {
            const r = 1.05;
            pet.hunger = Math.max(0, pet.hunger - r * 0.85);
            pet.happiness = Math.max(0, pet.happiness - r * 0.75);
            pet.cleanliness = Math.max(0, pet.cleanliness - r * 0.55);
            pet.energy = Math.max(0, pet.energy - r * 0.65);
            if (Math.random() < 0.05) pet.happiness = Math.max(0, pet.happiness - 3);
            if (Math.random() < 0.08) pet.age += 0.08;
            updateUI();
            savePet();
        }

        function startDecay() {
            if (decayInterval) clearInterval(decayInterval);
            decayInterval = setInterval(decayStats, 6500);
        }

        function resetPet() {
            if (!confirm('Reset your pet?')) return;
            pet = { name: "Pixel", hunger: 80, happiness: 75, cleanliness: 85, energy: 90, age: 0 };
            currentStage = 0;
            localStorage.removeItem('virtualPet');
            updateUI();
        }

        function init() {
            loadPet();
            document.getElementById('petNameDisplay').textContent = pet.name;
            updateUI();
            startDecay();

            drawPet('happy', 0, 0);
            requestAnimationFrame(animate);
        }

        window.onload = init;
