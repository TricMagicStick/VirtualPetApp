<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Virtual Pet</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        :root {
            --bg: #0a0f1e;
            --card: #161b2e;
            --card-border: #252b45;
            --accent: #22c55e;
        }
        
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: #e2e8f0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }
        
        .app {
            max-width: 380px;
            margin: 0 auto;
            padding: 12px 14px 20px;
            padding-top: max(12px, env(safe-area-inset-top));
        }
        
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 0 4px;
        }
        
        .title {
            font-family: 'Press Start 2P', system-ui;
            font-size: 22px;
            font-weight: 700;
            color: #22c55e;
            letter-spacing: 1px;
            margin: 0;
            line-height: 1;
        }
        
        .reset-btn {
            background: #3f1f1f;
            color: #fda4af;
            border: none;
            padding: 6px 12px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        
        .name-section {
            margin-bottom: 12px;
            padding: 0 4px;
        }
        
        .name-label {
            font-size: 10px;
            font-weight: 600;
            color: #64748b;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
            padding-left: 2px;
        }
        
        .name-input {
            width: 100%;
            background: #161b2e;
            border: 1.5px solid #252b45;
            border-radius: 14px;
            padding: 9px 14px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            outline: none;
        }
        
        .name-input:focus {
            border-color: #22c55e;
        }
        
        .pet-card {
            background: #161b2e;
            border: 1.5px solid #252b45;
            border-radius: 22px;
            padding: 18px 16px 16px;
            margin-bottom: 14px;
            box-shadow: 0 8px 25px -5px rgb(0 0 0 / 0.3);
            text-align: center;
        }
        
        .pet-visual {
            width: 138px;
            height: 138px;
            background: #252b45;
            border-radius: 9999px;
            border: 7px solid #166534;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            position: relative;
            box-shadow: inset 0 4px 12px rgb(0 0 0 / 0.4);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .pet-visual.happy { animation: bounce 1.1s infinite ease-in-out; }
        .pet-visual.sad { animation: shake 0.55s infinite ease-in-out; }
        
        .pet-emoji {
            font-size: 92px;
            line-height: 1;
            transition: transform 0.3s ease;
        }
        
        .pet-face-details {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 32px;
        }
        
        .pet-face-details div {
            width: 9px;
            height: 9px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 0 2.5px #252b45;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25%, 75% { transform: translateX(-5px); }
        }
        
        .mood {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
        }
        
        .age {
            font-size: 10px;
            color: #64748b;
        }
        
        .section-header {
            font-size: 10px;
            font-weight: 700;
            color: #64748b;
            letter-spacing: 1px;
            margin: 0 0 8px 6px;
        }
        
        .stats-card {
            background: #161b2e;
            border: 1.5px solid #252b45;
            border-radius: 18px;
            padding: 14px 14px 6px;
            margin-bottom: 14px;
            box-shadow: 0 6px 20px -4px rgb(0 0 0 / 0.25);
        }
        
        .stat {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 11px;
        }
        
        .stat:last-child { margin-bottom: 0; }
        
        .stat-icon {
            width: 26px;
            font-size: 20px;
            flex-shrink: 0;
        }
        
        .stat-main {
            flex: 1;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        
        .stat-name {
            font-weight: 600;
            font-size: 14px;
        }
        
        .stat-value {
            font-family: ui-monospace, monospace;
            font-size: 13px;
            font-weight: 700;
            color: #cbd5e1;
        }
        
        .progress {
            height: 7px;
            background: #252b45;
            border-radius: 999px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            border-radius: 999px;
            transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .hunger .progress-bar { background: linear-gradient(to right, #f59e0b, #fb923c); }
        .happiness .progress-bar { background: linear-gradient(to right, #ec4899, #f43f5e); }
        .cleanliness .progress-bar { background: linear-gradient(to right, #06b6d4, #22d3ee); }
        .energy .progress-bar { background: linear-gradient(to right, #eab308, #facc15); }
        
        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }
        
        .action {
            background: #161b2e;
            border: 1.5px solid #252b45;
            border-radius: 16px;
            padding: 14px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px -2px rgb(0 0 0 / 0.2);
        }
        
        .action:active {
            transform: scale(0.96);
            background: #1f253d;
        }
        
        .action-icon {
            font-size: 26px;
        }
        
        .action-label {
            font-weight: 700;
            font-size: 14px;
        }
        
        .action-sub {
            font-size: 10px;
            color: #64748b;
            font-weight: 500;
        }
        
        .status {
            background: #161b2e;
            border: 1.5px solid #252b45;
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            box-shadow: 0 4px 15px -3px rgb(0 0 0 / 0.2);
        }
        
        .status-icon {
            font-size: 18px;
            margin-top: 1px;
        }
        
        .status-text {
            font-size: 13.5px;
            line-height: 1.45;
            flex: 1;
        }
        
        .critical { color: #f87171; font-weight: 600; }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <div class="header">
            <h1 class="title">VIRTUAL PET</h1>
            <button onclick="resetPet()" class="reset-btn">
                <span>↻</span>
                <span style="font-size:10px; font-weight:700;">RESET</span>
            </button>
        </div>

        <!-- Name -->
        <div class="name-section">
            <div class="name-label">YOUR PET'S NAME</div>
            <input id="petName" type="text" value="Pixel" class="name-input" oninput="updatePetName()">
        </div>

        <!-- Pet -->
        <div class="pet-card">
            <div id="petVisual" class="pet-visual">
                <div id="petEmoji" class="pet-emoji">🐱</div>
                <div class="pet-face-details">
                    <div></div>
                    <div></div>
                </div>
            </div>
            <div id="petMood" class="mood" style="color:#22c55e">VERY HAPPY</div>
            <div class="age">Age: <span id="ageValue">0</span> days</div>
        </div>

        <!-- Stats -->
        <div>
            <div class="section-header">NEEDS</div>
            <div class="stats-card">
                <div class="stat hunger">
                    <div class="stat-icon">🍎</div>
                    <div class="stat-main">
                        <div class="stat-row">
                            <div class="stat-name">Hunger</div>
                            <div id="hungerValue" class="stat-value">80</div>
                        </div>
                        <div class="progress"><div id="hungerBar" class="progress-bar" style="width:80%"></div></div>
                    </div>
                </div>
                
                <div class="stat happiness">
                    <div class="stat-icon">❤️</div>
                    <div class="stat-main">
                        <div class="stat-row">
                            <div class="stat-name">Happiness</div>
                            <div id="happinessValue" class="stat-value">75</div>
                        </div>
                        <div class="progress"><div id="happinessBar" class="progress-bar" style="width:75%"></div></div>
                    </div>
                </div>
                
                <div class="stat cleanliness">
                    <div class="stat-icon">🧼</div>
                    <div class="stat-main">
                        <div class="stat-row">
                            <div class="stat-name">Cleanliness</div>
                            <div id="cleanValue" class="stat-value">85</div>
                        </div>
                        <div class="progress"><div id="cleanBar" class="progress-bar" style="width:85%"></div></div>
                    </div>
                </div>
                
                <div class="stat energy">
                    <div class="stat-icon">⚡</div>
                    <div class="stat-main">
                        <div class="stat-row">
                            <div class="stat-name">Energy</div>
                            <div id="energyValue" class="stat-value">90</div>
                        </div>
                        <div class="progress"><div id="energyBar" class="progress-bar" style="width:90%"></div></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div>
            <div class="section-header">ACTIONS</div>
            <div class="actions">
                <button onclick="feedPet()" class="action">
                    <div class="action-icon">🍎</div>
                    <div class="action-label">Feed</div>
                    <div class="action-sub">+ Hunger</div>
                </button>
                
                <button onclick="playWithPet()" class="action">
                    <div class="action-icon">🎮</div>
                    <div class="action-label">Play</div>
                    <div class="action-sub">+ Happiness</div>
                </button>
                
                <button onclick="cleanPet()" class="action">
                    <div class="action-icon">🧼</div>
                    <div class="action-label">Clean</div>
                    <div class="action-sub">+ Cleanliness</div>
                </button>
                
                <button onclick="restPet()" class="action">
                    <div class="action-icon">🛏️</div>
                    <div class="action-label">Rest</div>
                    <div class="action-sub">+ Energy</div>
                </button>
            </div>
        </div>

        <!-- Status -->
        <div class="status">
            <div class="status-icon">💬</div>
            <div id="statusMessage" class="status-text">
                Your pet is doing great! Keep caring for it.
            </div>
        </div>
    </div>

    <script>
        let pet = {
            name: "Pixel",
            hunger: 80,
            happiness: 75,
            cleanliness: 85,
            energy: 90,
            age: 0
        };
        let messages = [];
        let decayInterval = null;
        
        function savePet() {
            localStorage.setItem('virtualPet', JSON.stringify(pet));
            localStorage.setItem('virtualPetMessages', JSON.stringify(messages));
        }
        
        function loadPet() {
            const saved = localStorage.getItem('virtualPet');
            if (saved) pet = { ...pet, ...JSON.parse(saved) };
            const savedMsg = localStorage.getItem('virtualPetMessages');
            if (savedMsg) messages = JSON.parse(savedMsg);
            document.getElementById('petName').value = pet.name;
        }
        
        function updatePetName() {
            pet.name = document.getElementById('petName').value.trim() || "Pixel";
            savePet();
            updateUI();
        }
        
        function updateUI() {
            document.getElementById('hungerValue').textContent = Math.round(pet.hunger);
            document.getElementById('happinessValue').textContent = Math.round(pet.happiness);
            document.getElementById('cleanValue').textContent = Math.round(pet.cleanliness);
            document.getElementById('energyValue').textContent = Math.round(pet.energy);
            document.getElementById('ageValue').textContent = Math.floor(pet.age);
            
            document.getElementById('hungerBar').style.width = pet.hunger + '%';
            document.getElementById('happinessBar').style.width = pet.happiness + '%';
            document.getElementById('cleanBar').style.width = pet.cleanliness + '%';
            document.getElementById('energyBar').style.width = pet.energy + '%';
            
            const visual = document.getElementById('petVisual');
            const emoji = document.getElementById('petEmoji');
            const moodEl = document.getElementById('petMood');
            
            visual.classList.remove('happy', 'sad');
            const avg = (pet.hunger + pet.happiness + pet.cleanliness + pet.energy) / 4;
            
            let emojiChar = '🐱', moodText = 'CONTENT', moodColor = '#64748b';
            
            if (avg >= 80) {
                emojiChar = '😺'; moodText = 'VERY HAPPY'; moodColor = '#22c55e'; visual.classList.add('happy');
            } else if (avg >= 60) {
                emojiChar = '🐱'; moodText = 'HAPPY'; moodColor = '#22c55e';
            } else if (avg >= 40) {
                emojiChar = '😿'; moodText = 'NEEDS CARE'; moodColor = '#f59e0b'; visual.classList.add('sad');
            } else {
                emojiChar = '😾'; moodText = 'STRUGGLING'; moodColor = '#ef4444'; visual.classList.add('sad');
            }
            
            emoji.textContent = emojiChar;
            moodEl.textContent = moodText;
            moodEl.style.color = moodColor;
            
            updateStatus(avg);
        }
        
        function updateStatus(avg) {
            const el = document.getElementById('statusMessage');
            el.classList.remove('critical');
            
            if (avg >= 85) el.textContent = `${pet.name} is thriving! You're doing great.`;
            else if (avg >= 70) el.textContent = `${pet.name} is happy and well cared for.`;
            else if (avg >= 50) el.textContent = `${pet.name} could use some attention.`;
            else if (avg >= 30) { el.textContent = `${pet.name} is feeling neglected.`; el.classList.add('critical'); }
            else { el.textContent = `${pet.name} is really struggling...`; el.classList.add('critical'); }
        }
        
        function addMessage(text) {
            messages.unshift(text);
            if (messages.length > 4) messages.pop();
            const el = document.getElementById('statusMessage');
            el.textContent = text;
            el.classList.remove('critical');
            savePet();
        }
        
        function feedPet() {
            if (pet.hunger >= 95) { addMessage(`${pet.name} is already full!`); return; }
            pet.hunger = Math.min(100, pet.hunger + 22);
            pet.happiness = Math.min(100, pet.happiness + 5);
            pet.energy = Math.max(0, pet.energy - 3);
            addMessage(`You fed ${pet.name}. Yummy!`);
            updateUI(); savePet(); checkLow();
        }
        
        function playWithPet() {
            if (pet.energy < 15) { addMessage(`${pet.name} is too tired to play.`); return; }
            pet.happiness = Math.min(100, pet.happiness + 25);
            pet.hunger = Math.max(0, pet.hunger - 8);
            pet.energy = Math.max(0, pet.energy - 18);
            pet.cleanliness = Math.max(0, pet.cleanliness - 5);
            addMessage(`You played with ${pet.name}! Fun!`);
            updateUI(); savePet(); checkLow();
        }
        
        function cleanPet() {
            if (pet.cleanliness >= 95) { addMessage(`${pet.name} is already clean.`); return; }
            pet.cleanliness = Math.min(100, pet.cleanliness + 28);
            pet.happiness = Math.min(100, pet.happiness + 8);
            pet.energy = Math.max(0, pet.energy - 5);
            addMessage(`You cleaned ${pet.name}. Fresh!`);
            updateUI(); savePet(); checkLow();
        }
        
        function restPet() {
            if (pet.energy >= 95) { addMessage(`${pet.name} isn't tired.`); return; }
            pet.energy = Math.min(100, pet.energy + 30);
            pet.hunger = Math.max(0, pet.hunger - 5);
            pet.happiness = Math.min(100, pet.happiness + 4);
            addMessage(`${pet.name} had a nice rest.`);
            updateUI(); savePet(); checkLow();
        }
        
        function checkLow() {
            const low = [];
            if (pet.hunger <= 15) low.push('hungry');
            if (pet.happiness <= 15) low.push('unhappy');
            if (pet.cleanliness <= 15) low.push('dirty');
            if (pet.energy <= 15) low.push('exhausted');
            if (low.length) {
                const el = document.getElementById('statusMessage');
                el.textContent = `${pet.name} is ${low.join(' and ')}!`;
                el.classList.add('critical');
            }
        }
        
        function decayStats() {
            const r = 1.1;
            pet.hunger = Math.max(0, pet.hunger - r * 0.9);
            pet.happiness = Math.max(0, pet.happiness - r * 0.8);
            pet.cleanliness = Math.max(0, pet.cleanliness - r * 0.6);
            pet.energy = Math.max(0, pet.energy - r * 0.7);
            if (Math.random() < 0.06) pet.happiness = Math.max(0, pet.happiness - 3);
            if (Math.random() < 0.1) pet.age += 0.1;
            updateUI(); savePet(); checkLow();
        }
        
        function startDecay() {
            if (decayInterval) clearInterval(decayInterval);
            decayInterval = setInterval(decayStats, 7000);
        }
        
        function resetPet() {
            if (!confirm('Reset your pet?')) return;
            pet = { name: "Pixel", hunger: 80, happiness: 75, cleanliness: 85, energy: 90, age: 0 };
            messages = [];
            document.getElementById('petName').value = pet.name;
            localStorage.removeItem('virtualPet');
            localStorage.removeItem('virtualPetMessages');
            updateUI();
            document.getElementById('statusMessage').textContent = 'Fresh start!';
        }
        
        function init() {
            loadPet();
            updateUI();
            const msg = document.getElementById('statusMessage');
            if (messages.length === 0) msg.textContent = `Welcome! Take good care of ${pet.name}.`;
            else msg.textContent = messages[0] || 'Welcome back!';
            startDecay();
        }
        
        window.onload = init;
    </script>
</body>
</html>
