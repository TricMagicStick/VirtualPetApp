<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Pet • Offline</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        :root {
            --bg: #0f172a;
            --card: #1e2937;
            --accent: #10b981;
            --accent-dark: #059669;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f172a 0%, #1e1135 100%);
            color: #e2e8f0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            line-height: 1.5;
        }
        
        .pixel-font {
            font-family: 'Press Start 2P', system-ui;
            letter-spacing: 1px;
        }
        
        .container {
            max-width: 420px;
            margin: 0 auto;
            padding: 24px 16px;
        }
        
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        
        .title {
            font-size: 28px;
            font-weight: 700;
            color: #10b981;
            margin: 0;
            line-height: 1;
        }
        
        .subtitle {
            font-size: 12px;
            color: #64748b;
            margin-top: 2px;
        }
        
        .card {
            background: #1e2937;
            border-radius: 20px;
            border: 1px solid #334155;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }
        
        .pet-visual {
            width: 160px;
            height: 160px;
            background: #334155;
            border-radius: 9999px;
            border: 6px solid #064e3b;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            position: relative;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .pet-visual.happy {
            animation: petBounce 1.2s infinite ease-in-out;
        }
        
        .pet-visual.sad {
            animation: petShake 0.6s infinite ease-in-out;
        }
        
        .pet-emoji {
            font-size: 110px;
            line-height: 1;
            transition: all 0.4s ease;
            user-select: none;
        }
        
        .pet-face-details {
            position: absolute;
            top: 38%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 38px;
        }
        
        .pet-face-details div {
            width: 11px;
            height: 11px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 0 3px #1e2937;
            opacity: 0.85;
        }
        
        @keyframes petBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        
        @keyframes petShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        
        .mood-text {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-align: center;
            margin-bottom: 4px;
        }
        
        .age-text {
            font-size: 11px;
            color: #64748b;
            text-align: center;
        }
        
        .section-title {
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            padding-left: 4px;
        }
        
        .stat-row {
            margin-bottom: 16px;
        }
        
        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            padding: 0 4px;
        }
        
        .stat-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }
        
        .stat-value {
            font-family: ui-monospace, monospace;
            font-size: 13px;
            font-weight: 600;
            min-width: 32px;
            text-align: right;
        }
        
        .progress-bg {
            height: 10px;
            background: #334155;
            border-radius: 9999px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            border-radius: 9999px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .hunger .progress-fill { background: linear-gradient(to right, #fb923c, #f59e0b); }
        .happiness .progress-fill { background: linear-gradient(to right, #f472b6, #e11d48); }
        .cleanliness .progress-fill { background: linear-gradient(to right, #22d3ee, #14b8a6); }
        .energy .progress-fill { background: linear-gradient(to right, #facc15, #eab308); }
        
        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .action-btn {
            background: #1e2937;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        
        .action-btn:hover {
            border-color: #475569;
            transform: translateY(-1px);
        }
        
        .action-btn:active {
            transform: scale(0.97);
        }
        
        .action-icon {
            font-size: 28px;
            margin-bottom: 2px;
        }
        
        .action-label {
            font-weight: 600;
            font-size: 14px;
        }
        
        .action-sub {
            font-size: 10px;
            color: #64748b;
        }
        
        .status-card {
            background: #1e2937;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        
        .status-text {
            font-size: 14px;
            line-height: 1.5;
            flex: 1;
        }
        
        .message {
            color: #10b981;
        }
        
        .message.critical {
            color: #f87171;
            font-weight: 500;
        }
        
        .reset-btn {
            background: #450a0a;
            color: #fda4af;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .reset-btn:hover {
            background: #7f1d1d;
        }
        
        .tip {
            font-size: 11px;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 4px;
        }
        
        .name-input {
            width: 100%;
            background: #1e2937;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 17px;
            font-weight: 500;
            color: white;
            outline: none;
        }
        
        .name-input:focus {
            border-color: #10b981;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div>
                <h1 class="title pixel-font">VIRTUAL PET</h1>
                <div class="subtitle">Offline • v1.0</div>
            </div>
            <button onclick="resetPet()" class="reset-btn">
                <span>↻</span>
                <span>Reset</span>
            </button>
        </div>

        <!-- Pet Name -->
        <div style="margin-bottom: 16px;">
            <div style="font-size: 11px; color: #64748b; margin-bottom: 6px; padding-left: 4px;">YOUR PET'S NAME</div>
            <input id="petName" type="text" value="Pixel" 
                   class="name-input"
                   oninput="updatePetName()">
        </div>

        <!-- Pet Visual -->
        <div class="card" style="text-align: center; padding-top: 24px; padding-bottom: 24px;">
            <div id="petVisual" class="pet-visual">
                <div id="petEmoji" class="pet-emoji">🐱</div>
                <div class="pet-face-details">
                    <div></div>
                    <div></div>
                </div>
            </div>
            
            <div id="petMood" class="mood-text" style="color: #10b981;">HAPPY</div>
            <div class="age-text">Age: <span id="ageValue">0</span> days</div>
        </div>

        <!-- Stats -->
        <div>
            <div class="section-title">NEEDS</div>
            
            <div class="card" style="padding: 20px 18px;">
                <!-- Hunger -->
                <div class="stat-row hunger">
                    <div class="stat-header">
                        <div class="stat-label">
                            <span style="font-size: 18px;">🍎</span>
                            <span>Hunger</span>
                        </div>
                        <span id="hungerValue" class="stat-value">80</span>
                    </div>
                    <div class="progress-bg">
                        <div id="hungerBar" class="progress-fill" style="width: 80%"></div>
                    </div>
                </div>
                
                <!-- Happiness -->
                <div class="stat-row happiness">
                    <div class="stat-header">
                        <div class="stat-label">
                            <span style="font-size: 18px;">❤️</span>
                            <span>Happiness</span>
                        </div>
                        <span id="happinessValue" class="stat-value">75</span>
                    </div>
                    <div class="progress-bg">
                        <div id="happinessBar" class="progress-fill" style="width: 75%"></div>
                    </div>
                </div>
                
                <!-- Cleanliness -->
                <div class="stat-row cleanliness">
                    <div class="stat-header">
                        <div class="stat-label">
                            <span style="font-size: 18px;">🧼</span>
                            <span>Cleanliness</span>
                        </div>
                        <span id="cleanValue" class="stat-value">85</span>
                    </div>
                    <div class="progress-bg">
                        <div id="cleanBar" class="progress-fill" style="width: 85%"></div>
                    </div>
                </div>
                
                <!-- Energy -->
                <div class="stat-row energy">
                    <div class="stat-header">
                        <div class="stat-label">
                            <span style="font-size: 18px;">⚡</span>
                            <span>Energy</span>
                        </div>
                        <span id="energyValue" class="stat-value">90</span>
                    </div>
                    <div class="progress-bg">
                        <div id="energyBar" class="progress-fill" style="width: 90%"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div>
            <div class="section-title">ACTIONS</div>
            
            <div class="actions-grid">
                <button onclick="feedPet()" class="action-btn">
                    <div class="action-icon">🍎</div>
                    <div>
                        <div class="action-label">Feed</div>
                        <div class="action-sub">+ Hunger</div>
                    </div>
                </button>
                
                <button onclick="playWithPet()" class="action-btn">
                    <div class="action-icon">🎮</div>
                    <div>
                        <div class="action-label">Play</div>
                        <div class="action-sub">+ Happiness</div>
                    </div>
                </button>
                
                <button onclick="cleanPet()" class="action-btn">
                    <div class="action-icon">🧼</div>
                    <div>
                        <div class="action-label">Clean</div>
                        <div class="action-sub">+ Cleanliness</div>
                    </div>
                </button>
                
                <button onclick="restPet()" class="action-btn">
                    <div class="action-icon">🛏️</div>
                    <div>
                        <div class="action-label">Rest</div>
                        <div class="action-sub">+ Energy</div>
                    </div>
                </button>
            </div>
        </div>

        <!-- Status -->
        <div class="status-card">
            <div style="font-size: 20px; margin-top: 2px;">💬</div>
            <div id="statusMessage" class="status-text message">
                Your pet is doing great! Keep caring for it.
            </div>
        </div>

        <div class="tip">
            <span>ⓘ</span>
            <span>Stats decrease over time. Take good care of your pet!</span>
        </div>
    </div>

    <script>
        // Game State
        let pet = {
            name: "Pixel",
            hunger: 80,
            happiness: 75,
            cleanliness: 85,
            energy: 90,
            age: 0,
            lastUpdate: Date.now()
        };
        
        let messages = [];
        let decayInterval = null;
        
        function savePet() {
            localStorage.setItem('virtualPet', JSON.stringify(pet));
            localStorage.setItem('virtualPetMessages', JSON.stringify(messages));
        }
        
        function loadPet() {
            const saved = localStorage.getItem('virtualPet');
            if (saved) {
                const loaded = JSON.parse(saved);
                pet = { ...pet, ...loaded };
            }
            
            const savedMessages = localStorage.getItem('virtualPetMessages');
            if (savedMessages) {
                messages = JSON.parse(savedMessages);
            }
            
            document.getElementById('petName').value = pet.name;
        }
        
        function updatePetName() {
            const input = document.getElementById('petName');
            pet.name = input.value.trim() || "Pixel";
            savePet();
            updateUI();
        }
        
        function updateUI() {
            // Numeric values
            document.getElementById('hungerValue').textContent = Math.round(pet.hunger);
            document.getElementById('happinessValue').textContent = Math.round(pet.happiness);
            document.getElementById('cleanValue').textContent = Math.round(pet.cleanliness);
            document.getElementById('energyValue').textContent = Math.round(pet.energy);
            document.getElementById('ageValue').textContent = Math.floor(pet.age);
            
            // Progress bars
            document.getElementById('hungerBar').style.width = `${pet.hunger}%`;
            document.getElementById('happinessBar').style.width = `${pet.happiness}%`;
            document.getElementById('cleanBar').style.width = `${pet.cleanliness}%`;
            document.getElementById('energyBar').style.width = `${pet.energy}%`;
            
            // Pet mood & animation
            const visual = document.getElementById('petVisual');
            const emojiEl = document.getElementById('petEmoji');
            const moodEl = document.getElementById('petMood');
            
            const avg = (pet.hunger + pet.happiness + pet.cleanliness + pet.energy) / 4;
            
            let emoji = '🐱';
            let moodText = 'CONTENT';
            let moodColor = '#64748b';
            
            visual.classList.remove('happy', 'sad');
            
            if (avg >= 80) {
                emoji = '😺';
                moodText = 'VERY HAPPY';
                moodColor = '#10b981';
                visual.classList.add('happy');
            } else if (avg >= 60) {
                emoji = '🐱';
                moodText = 'HAPPY';
                moodColor = '#10b981';
            } else if (avg >= 40) {
                emoji = '😿';
                moodText = 'NEEDS CARE';
                moodColor = '#f59e0b';
                visual.classList.add('sad');
            } else {
                emoji = '😾';
                moodText = 'STRUGGLING';
                moodColor = '#ef4444';
                visual.classList.add('sad');
            }
            
            emojiEl.textContent = emoji;
            moodEl.textContent = moodText;
            moodEl.style.color = moodColor;
            
            updateStatusMessage(avg);
        }
        
        function updateStatusMessage(avg) {
            const msgEl = document.getElementById('statusMessage');
            msgEl.classList.remove('critical');
            
            if (avg >= 85) {
                msgEl.textContent = `${pet.name} is thriving! You're doing great.`;
            } else if (avg >= 70) {
                msgEl.textContent = `${pet.name} is happy and well cared for.`;
            } else if (avg >= 50) {
                msgEl.textContent = `${pet.name} could use some attention.`;
            } else if (avg >= 30) {
                msgEl.textContent = `${pet.name} is feeling neglected. Do something!`;
                msgEl.classList.add('critical');
            } else {
                msgEl.textContent = `${pet.name} is really struggling... help!`;
                msgEl.classList.add('critical');
            }
        }
        
        function addMessage(text) {
            messages.unshift(text);
            if (messages.length > 5) messages.pop();
            
            const msgEl = document.getElementById('statusMessage');
            msgEl.textContent = text;
            msgEl.classList.remove('critical');
            
            savePet();
        }
        
        function feedPet() {
            if (pet.hunger >= 95) {
                addMessage(`${pet.name} is already full!`);
                return;
            }
            pet.hunger = Math.min(100, pet.hunger + 22);
            pet.happiness = Math.min(100, pet.happiness + 5);
            pet.energy = Math.max(0, pet.energy - 3);
            
            addMessage(`You fed ${pet.name}. Delicious!`);
            updateUI();
            savePet();
            checkCritical();
        }
        
        function playWithPet() {
            if (pet.energy < 15) {
                addMessage(`${pet.name} is too tired to play.`);
                return;
            }
            pet.happiness = Math.min(100, pet.happiness + 25);
            pet.hunger = Math.max(0, pet.hunger - 8);
            pet.energy = Math.max(0, pet.energy - 18);
            pet.cleanliness = Math.max(0, pet.cleanliness - 5);
            
            addMessage(`You played with ${pet.name}! So much fun.`);
            updateUI();
            savePet();
            checkCritical();
        }
        
        function cleanPet() {
            if (pet.cleanliness >= 95) {
                addMessage(`${pet.name} is already clean.`);
                return;
            }
            pet.cleanliness = Math.min(100, pet.cleanliness + 28);
            pet.happiness = Math.min(100, pet.happiness + 8);
            pet.energy = Math.max(0, pet.energy - 5);
            
            addMessage(`You cleaned ${pet.name}. Fresh and happy!`);
            updateUI();
            savePet();
            checkCritical();
        }
        
        function restPet() {
            if (pet.energy >= 95) {
                addMessage(`${pet.name} isn't tired.`);
                return;
            }
            pet.energy = Math.min(100, pet.energy + 30);
            pet.hunger = Math.max(0, pet.hunger - 5);
            pet.happiness = Math.min(100, pet.happiness + 4);
            
            addMessage(`${pet.name} had a good rest. Refreshed!`);
            updateUI();
            savePet();
            checkCritical();
        }
        
        function checkCritical() {
            const lowStats = [];
            if (pet.hunger <= 15) lowStats.push('hungry');
            if (pet.happiness <= 15) lowStats.push('unhappy');
            if (pet.cleanliness <= 15) lowStats.push('dirty');
            if (pet.energy <= 15) lowStats.push('exhausted');
            
            if (lowStats.length > 0) {
                const msgEl = document.getElementById('statusMessage');
                msgEl.textContent = `${pet.name} is ${lowStats.join(' and ')}!`;
                msgEl.classList.add('critical');
            }
        }
        
        function decayStats() {
            const rate = 1.15;
            
            pet.hunger = Math.max(0, pet.hunger - rate * 0.85);
            pet.happiness = Math.max(0, pet.happiness - rate * 0.75);
            pet.cleanliness = Math.max(0, pet.cleanliness - rate * 0.55);
            pet.energy = Math.max(0, pet.energy - rate * 0.65);
            
            // Occasional random dip
            if (Math.random() < 0.07) {
                pet.happiness = Math.max(0, pet.happiness - 4);
            }
            
            // Slow aging
            if (Math.random() < 0.12) {
                pet.age += 0.12;
            }
            
            updateUI();
            savePet();
            checkCritical();
        }
        
        function startDecay() {
            if (decayInterval) clearInterval(decayInterval);
            decayInterval = setInterval(decayStats, 7500);
        }
        
        function resetPet() {
            if (!confirm('Reset your pet back to default stats?')) return;
            
            pet = {
                name: "Pixel",
                hunger: 80,
                happiness: 75,
                cleanliness: 85,
                energy: 90,
                age: 0,
                lastUpdate: Date.now()
            };
            messages = [];
            
            document.getElementById('petName').value = pet.name;
            localStorage.removeItem('virtualPet');
            localStorage.removeItem('virtualPetMessages');
            
            updateUI();
            const msgEl = document.getElementById('statusMessage');
            msgEl.textContent = 'Pet reset. Fresh start!';
            msgEl.classList.remove('critical');
        }
        
        function initGame() {
            loadPet();
            updateUI();
            
            const msgEl = document.getElementById('statusMessage');
            
            if (messages.length === 0) {
                msgEl.textContent = `Welcome! Take good care of ${pet.name}.`;
            } else {
                msgEl.textContent = messages[0] || `Welcome back to ${pet.name}!`;
            }
            
            startDecay();
        }
        
        window.onload = initGame;
    </script>
</body>
</html>
